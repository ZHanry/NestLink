[package]
name = "nestlink-network-security-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
nestlink-protocol = { path = "../../../crates/protocol" }

[[bin]]
name = "network_wire"
path = "fuzz_targets/network_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seed_network"
path = "seed_network.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[profile.release]
debug = 1
overflow-checks = true
