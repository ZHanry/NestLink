[package]
name = "nestlink-browser-native-host-fixture"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "2"

[dependencies]
nestlink-app-core = { version = "=0.7.0-rc.1", path = "../../../crates/app-core" }
nestlink-sdk = { version = "=0.7.0-rc.1", path = "../../../crates/sdk" }
nestlink-server = { version = "=0.7.0-rc.1", path = "../../../apps/server" }
nestlink-storage = { version = "=0.7.0-rc.1", path = "../../../crates/storage" }
nestlink-auth = { version = "=0.7.0-rc.1", path = "../../../crates/auth" }
nestlink-identity = { version = "=0.7.0-rc.1", path = "../../../crates/identity" }
nestlink-protocol = { version = "=0.7.0-rc.1", path = "../../../crates/protocol" }
nestlink-remote = { version = "=0.7.0-rc.1", path = "../../../crates/remote" }
nestlink-media-codec = { version = "=0.7.0-rc.1", path = "../../../crates/media-codec" }
nestlink-platform-files = { version = "=0.7.0-rc.1", path = "../../../crates/platform-files" }
nestlink-platform-security = { version = "=0.7.0-rc.1", path = "../../../crates/platform-security" }
nestlink-session = { version = "=0.7.0-rc.1", path = "../../../crates/session" }
axum = "=0.8.9"
base64 = "=0.22.1"
log = "=0.4.34"
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }

[patch.crates-io]
dtls = { version = "=0.13.0", git = "https://github.com/ZHanry/NestLink-dependencies.git", branch = "main" }
turn = { version = "=0.17.2", git = "https://github.com/ZHanry/NestLink-dependencies.git", branch = "main" }
turn-client = { package = "turn", version = "=0.11.0", git = "https://github.com/ZHanry/NestLink-dependencies.git", branch = "main" }
webrtc-ice = { git = "https://github.com/ZHanry/NestLink-dependencies.git", branch = "main" }
leptos_macro = { git = "https://github.com/ZHanry/NestLink-dependencies.git", branch = "main" }
tachys = { git = "https://github.com/ZHanry/NestLink-dependencies.git", branch = "main" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
