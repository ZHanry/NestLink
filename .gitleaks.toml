minVersion = "8.25.0"
[extend]
useDefault = true

# Reviewed public outputs and the RFC 6455 handshake example only.
# See docs/refactor/SECRET-SCAN-RC-2026-10-17.md.

[[allowlists]]
description = "Independently recomputed public test vectors"
condition = "AND"
regexTarget = "secret"
paths = ['''^crates/traversal/vendor/turn/src/auth/auth_test\.rs$''']
regexes = ['''^Tpz/nKkyvX/vMSLKvL4sbtBt8Vs=$''', '''^HWbnm25GwSj6jiHTEDMTO5D7aBw=$''']

[[allowlists]]
description = "Independently recomputed public test vectors"
condition = "AND"
regexTarget = "secret"
paths = ['''^scripts/refactor\-service\-caddy\-contract\.py$''']
regexes = ['''^dGhlIHNhbXBsZSBub25jZQ==$''']

# Six public provenance/identifier findings reviewed at exact historical locations.
# Each exclusion binds one rule, one file and one complete public digest.
# See docs/network-rewrite/SECRET-SCAN-REVIEW-2026-11-02.md.
[[allowlists]]
description = "Public ordinary-token Actions log SHA256"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^docs/network-rewrite/evidence/production-capability-47a0cec\.json$''']
regexes = ['''^c43085cb7af77230c355f88323c7340cc8c78247cd1ee5d5688d06312119dc7b$''']

[[allowlists]]
description = "Public pinned cloudflared source revision"
targetRules = ["cloudflare-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^scripts/network-rewrite-windows-tun\.py$''']
regexes = ['''^872b241f94871665c1c157adefcf90c11f0ead96$''']

[[allowlists]]
description = "Public Windows MIB_IF_ROW2.Mtu API field identifier"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^docs/adr/network/0045-windows-managed-tun-boundary\.md$''']
