name: Linux headless network installation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Cargo.*', 'rust-toolchain.toml', 'apps/daemon/**', 'apps/server/**', 'crates/**', 'third-party/**', 'packaging/**', 'config/product-scope.json', 'scripts/refactor-candidate-producer.py', 'scripts/refactor-linux-network-package.py', 'scripts/refactor-linux-package-faults.py', 'scripts/refactor-required-checks.py', 'tests/refactor/test_candidate_producer.py', 'tests/refactor/test_product_scope.py', '.github/workflows/linux-network-package.yml']
  pull_request:
    paths: ['Cargo.*', 'rust-toolchain.toml', 'apps/daemon/**', 'apps/server/**', 'crates/**', 'third-party/**', 'packaging/**', 'config/product-scope.json', 'scripts/refactor-candidate-producer.py', 'scripts/refactor-linux-network-package.py', 'scripts/refactor-linux-package-faults.py', 'scripts/refactor-required-checks.py', 'tests/refactor/test_candidate_producer.py', 'tests/refactor/test_product_scope.py', '.github/workflows/linux-network-package.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: linux-network-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/../linux-network-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
      - name: Prepare existing mature native inputs
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm perl pkg-config libpipewire-0.3-dev libasound2-dev iproute2
          echo "NESTLINK_CODEC_PREFIX=${{ runner.temp }}/network-codecs/${{ matrix.target }}" >> "$GITHUB_ENV"
      - name: Verify complete role inventory and actual Debian package isolation
        run: |
          python3 -B -m unittest discover -s tests/refactor -p test_candidate_producer.py
          python3 -B -m unittest discover -s tests/refactor -p test_product_scope.py
          python3 -B -m unittest discover -s tests/refactor -p test_rc_publish.py
      - name: Record exact native build provenance before compilation
        env:
          NESTLINK_PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/linux-network-build-evidence"
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,platform
          record = {"source_revision":os.environ["GITHUB_SHA"],"workflow_revision":os.environ["GITHUB_WORKFLOW_SHA"],"workflow":os.environ["GITHUB_WORKFLOW_REF"],"run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],"target":os.environ["NESTLINK_PACKAGE_TARGET"],"runner_environment":os.environ["RUNNER_ENVIRONMENT"],"machine":platform.machine(),"cargo_lock_sha256":hashlib.sha256(pathlib.Path("Cargo.lock").read_bytes()).hexdigest(),"qualification_claimed":False}
          (pathlib.Path(os.environ["RUNNER_TEMP"])/"linux-network-build-evidence/provenance.json").write_text(json.dumps(record,indent=2)+"\n")
          PY
      - name: Build locked codecs and exact native headless daemon on GitHub
        shell: bash
        run: |
          python3 -B scripts/refactor-native-codecs.py build --target ${{ matrix.target }} --cache-dir "${{ runner.temp }}/codec-sources" --work-dir "${{ runner.temp }}/network-codecs"
          python3 -B scripts/refactor-native-codecs.py verify --target ${{ matrix.target }} --prefix "$NESTLINK_CODEC_PREFIX"
          cargo build --locked --release -p nestlink-daemon -p nestlink-server 2>&1 | tee "$RUNNER_TEMP/linux-network-build-evidence/cargo-build.log"
      - name: Parse original package coordinator and fault fixtures on GitHub
        run: python3 -B -c 'import ast,pathlib; [ast.parse(path.read_text()) for path in map(pathlib.Path,["scripts/refactor-linux-network-package.py","scripts/refactor-linux-package-faults.py"])]'
      - name: Install exact bytes, require explicit authority and remove only package files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/refactor-linux-network-package.py --binary "$CARGO_TARGET_DIR/release/nestlink-daemon" --server "$CARGO_TARGET_DIR/release/nestlink-server" --output "${{ runner.temp }}/linux-network-package"
      - name: Locate actual package and build evidence after execution
        id: evidence-presence
        if: ${{ !cancelled() }}
        run: |
          if test -f "$RUNNER_TEMP/linux-network-package/linux-network-package.json"; then
            echo "package=true" >> "$GITHUB_OUTPUT"
          fi
          if test -f "$RUNNER_TEMP/linux-network-build-evidence/provenance.json"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Retain native package, exact hashes and actual installation logs
        if: ${{ !cancelled() && steps.evidence-presence.outputs.package == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-network-package-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-network-package
          if-no-files-found: error
          retention-days: 30
      - name: Retain same-source build evidence including pre-install failures
        if: ${{ !cancelled() && steps.evidence-presence.outputs.build == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-network-build-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-network-build-evidence
          if-no-files-found: error
          retention-days: 30
