          )
          $spaceDnsFailure = 0
          foreach ($spaceDnsTest in $spaceDnsTests) {
            $spaceDnsArguments = @('test', '--locked') + $spaceDnsTest.Args + @('--', '--show-output', '--test-threads=1', '--color', 'never')
