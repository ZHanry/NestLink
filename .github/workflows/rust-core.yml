              'crates/media-codec/src/lib.rs', 'crates/media-codec/src/h264.rs',
              'crates/media-codec/examples/windows-hevc-gpu-probe.rs',
              'scripts/refactor-windows-normal-user.py', '.github/workflows/rust-core.yml',
          ]
          subprocess.run(['git', 'diff', '--exit-code', 'HEAD', '--', *source_paths], check=True)
          target = pathlib.Path(os.environ.get('CARGO_TARGET_DIR') or 'target')
          if os.environ.get('CARGO_BUILD_TARGET'):
              target /= os.environ['CARGO_BUILD_TARGET']
          source = target / 'release/examples/windows-hevc-gpu-probe.exe'
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nestlink-hevc-gpu-target-probe'
          output.mkdir()
          copied = output / source.name
          shutil.copyfile(source, copied)
          manifest = {
              'schema': 1,
              'source_revision': revision,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow': os.environ['GITHUB_WORKFLOW'],
              'purpose': 'owned-synthetic-hevc-gpu-target-probe-only',
              'filename': copied.name,
              'bytes': copied.stat().st_size,
              'sha256': hashlib.sha256(copied.read_bytes()).hexdigest(),
              'build_profile': 'release',
              'build_command': 'cargo build --locked --release -p nestlink-media-codec --example windows-hevc-gpu-probe',
              'build_identity': 'verified-medium-non-admin-token',
