name: NestLink Rust core
on:
  push:
    branches: [main]
    paths: ['Cargo.*', 'rust-toolchain.toml', 'compatibility.json', 'deny.toml', 'config/ui-tokens.json', 'config/product-scope.json', 'config/dependency-forks.json', 'crates/**', 'third-party/**', 'apps/**', 'packaging/**', 'xtask/**', 'protocol-spec/**', '.cargo/**', 'scripts/refactor-*.py', 'scripts/acceptance/**', 'scripts/fixtures/browser-native-host/**', '.github/workflows/public-tunnel-acceptance.yml', 'scripts/test-vp8-boundary-sanitizer.sh', 'scripts/test-pipewire-audio-sanitizer.sh', 'tests/refactor/**', 'docs/refactor/native-codecs.lock.json', 'docs/refactor/cargo-notice-supplements.json', '.github/workflows/rust-core.yml']
  pull_request:
    paths: ['Cargo.*', 'rust-toolchain.toml', 'compatibility.json', 'deny.toml', 'config/ui-tokens.json', 'config/product-scope.json', 'config/dependency-forks.json', 'crates/**', 'third-party/**', 'apps/**', 'packaging/**', 'xtask/**', 'protocol-spec/**', '.cargo/**', 'scripts/refactor-*.py', 'scripts/acceptance/**', 'scripts/fixtures/browser-native-host/**', '.github/workflows/public-tunnel-acceptance.yml', 'scripts/test-vp8-boundary-sanitizer.sh', 'scripts/test-pipewire-audio-sanitizer.sh', 'tests/refactor/**', 'docs/refactor/native-codecs.lock.json', 'docs/refactor/cargo-notice-supplements.json', '.github/workflows/rust-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      # Large native/media test binaries exhausted the hosted Linux disk in
      # 41171092827. Keep debug assertions and all cases; omit debug information
      # from development/test artifacts rather than losing the runner logs.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify normal Windows test identity
        if: runner.os == 'Windows'
        run: python scripts/refactor-windows-normal-user.py python scripts/refactor-windows-normal-user.py --check
      - name: Set native codec location
        shell: pwsh
        env:
          NESTLINK_TARGET: ${{ matrix.target }}
        run: |
          $codecRoot = Join-Path $env:RUNNER_TEMP "nestlink-codecs/$env:NESTLINK_TARGET"
          "NESTLINK_CODEC_PREFIX=$codecRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build nasm pkg-config dbus libpipewire-0.3-dev pipewire-bin
      - if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MSYS
          install: make perl diffutils gawk sed grep coreutils nasm
          cache: false
      - if: runner.os == 'Linux'
        run: python3 scripts/refactor-native-codecs.py build --target ${{ matrix.target }} --cache-dir "${{ runner.temp }}/nestlink-codec-sources" --work-dir "${{ runner.temp }}/nestlink-codecs"
      - if: runner.os == 'Windows'
        run: python scripts/refactor-native-codecs.py build --target ${{ matrix.target }} --cache-dir "${{ runner.temp }}/nestlink-codec-sources" --work-dir "${{ runner.temp }}/nestlink-codecs" --msys-bin "${{ steps.msys.outputs.msys2-location }}/usr/bin" --nasm "${{ steps.msys.outputs.msys2-location }}/usr/bin/nasm.exe"
      - run: python scripts/refactor-native-codecs.py verify --target ${{ matrix.target }} --prefix "${{ env.NESTLINK_CODEC_PREFIX }}"
      - run: rustup show
      - name: Allow the normal Windows token to use CI build inputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testUserSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $testTemp = Join-Path $env:RUNNER_TEMP 'nestlink-normal-user-temp'
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          $testInputs = @(
            @{ Path = (Join-Path $env:USERPROFILE '.rustup'); Access = 'RX' },
            @{ Path = (Join-Path $env:USERPROFILE '.cargo'); Access = 'M' },
            @{ Path = $env:GITHUB_WORKSPACE; Access = 'M' },
            @{ Path = $env:NESTLINK_CODEC_PREFIX; Access = 'RX' },
            @{ Path = $testTemp; Access = 'M' }
          )
          foreach ($testInput in $testInputs) {
            & icacls $testInput.Path /grant "*${testUserSid}:(OI)(CI)$($testInput.Access)" /T /Q
            if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the CI build input permissions' }
          }
          "TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check Windows private files and process identity with the normal token
        if: runner.os == 'Windows'
        run: |
          python scripts/refactor-windows-normal-user.py rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-platform-security --tests -p nestlink-privileged --lib --no-fail-fast
      - name: Check independent subnet signatures and exact local consent
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $subnetCases = @(
            @{ Args = @('-p', 'nestlink-protocol', '--lib', 'subnet::') },
            @{ Args = @('-p', 'nestlink-identity', '--lib', 'subnet::') },
            @{ Args = @('-p', 'nestlink-sdk', '--lib', 'network::subnet::') }
          )
          foreach ($subnetCase in $subnetCases) {
            $subnetArgs = @('test', '--locked') + $subnetCase.Args + @('--', '--show-output', '--test-threads=1', '--color', 'never')
            if ($env:RUNNER_OS -eq 'Windows') {
              python scripts/refactor-windows-normal-user.py cargo @subnetArgs
            } else {
              cargo @subnetArgs
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check bounded Windows TUN pipe cancellation with the ordinary token
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-privileged --lib windows::network_tun:: -- --show-output --test-threads=1 --color never
      - name: Check SDK routed contracts on Linux before formatting
        id: sdk_routed_linux
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $sdkLog = Join-Path $env:RUNNER_TEMP 'nestlink-sdk-routed-tests.log'
          cargo test --locked -p nestlink-sdk --lib network::routed::tests:: -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $sdkLog
          exit $LASTEXITCODE
      - name: Check atomic service edge groups against real HTTP and file SQLite on Linux
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: cargo test --locked -p nestlink-sdk --test service_edge_groups -- --show-output --test-threads=1 --color never
      - name: Check atomic service edge groups with the ordinary Windows token
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-sdk --test service_edge_groups -- --show-output --test-threads=1 --color never
      - name: Check SDK routed contracts with the ordinary Windows token before formatting
        id: sdk_routed_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdkLog = Join-Path $env:RUNNER_TEMP 'nestlink-sdk-routed-tests.log'
          python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-sdk --lib network::routed::tests:: -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $sdkLog
          exit $LASTEXITCODE
      - name: Require every SDK routed source test to pass without ignored cases
        if: ${{ !cancelled() && (steps.sdk_routed_linux.outcome != 'skipped' || steps.sdk_routed_windows.outcome != 'skipped') }}
        shell: python
        run: |
          import json, os, pathlib, re
          sources = {
              'crates/sdk/src/network/routed_tests.rs': 'network::routed::tests',
              'crates/sdk/src/network/routed_tests/chain.rs': 'network::routed::tests::chain',
              'crates/sdk/src/network/routed_tests/route_set.rs': 'network::routed::tests::route_sets',
          }
          attributes, cases = [], []
          for path, prefix in sources.items():
              source = pathlib.Path(path).read_text(encoding='utf-8')
              attributes.extend(re.findall(r'(?m)^\s*#\[(?:tokio::)?test(?:\([^\]]*\))?\]', source))
              cases.extend((kind, f'{prefix}::{name}') for kind, name in re.findall(
                  r'(?m)^\s*#\[((?:tokio::)?test)(?:\([^\]]*\))?\]\s*'
                  r'(?:#\[[^\]]*\]\s*)*(?:async\s+)?fn\s+([A-Za-z_]\w*)\s*\(', source,
              ))
          expected = {name for _, name in cases}
          if not any(kind == 'tokio::test' for kind, _ in cases) or len(cases) != len(attributes) or len(expected) != len(cases):
              raise SystemExit('Could not enumerate every SDK routed test attribute and unique function name')
          log_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nestlink-sdk-routed-tests.log'
          log = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', log_path.read_text(encoding='utf-8'))
          results = re.findall(r'(?m)^test (network::routed::tests::[A-Za-z_]\w*(?:::[A-Za-z_]\w*)*) \.\.\. (ok|FAILED|ignored)\s*$', log)
          actual = {name for name, _ in results}
          summaries = re.findall(r'(?m)^test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;', log)
          receipt = {
              'source_revision': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'source_modules': sources,
              'expected_tests': sorted(expected),
              'tokio_tests': sorted(name for kind, name in cases if kind == 'tokio::test'),
              'results': results,
              'summaries': summaries,
              'missing_tests': sorted(expected - actual),
              'unexpected_tests': sorted(actual - expected),
          }
          receipt['passed'] = (
              actual == expected and len(results) == len(expected)
              and all(result == 'ok' for _, result in results)
              and summaries == [(str(len(expected)), '0', '0')]
          )
          log_path.with_suffix('.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2))
          if not receipt['passed']:
              raise SystemExit('SDK routed tests did not pass the complete current source inventory with zero failed/ignored cases')
      - name: Check actual management and node relay integration on Linux before formatting
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.sdk_routed_linux.outcome != 'skipped' }}
        shell: pwsh
        run: |
          $sdkLog = Join-Path $env:RUNNER_TEMP 'nestlink-sdk-network-relay-tests.log'
          cargo test --locked -p nestlink-sdk --test network_relay -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $sdkLog
          exit $LASTEXITCODE
      - name: Check actual management and node relay integration with the ordinary Windows token before formatting
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.sdk_routed_windows.outcome != 'skipped' }}
        shell: pwsh
        run: |
          $sdkLog = Join-Path $env:RUNNER_TEMP 'nestlink-sdk-network-relay-tests.log'
          python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-sdk --test network_relay -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $sdkLog
          exit $LASTEXITCODE
      - name: Check relay metadata migration and actual HTTP SDK on Linux before formatting
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: pwsh
        run: |
          $metadataLog = Join-Path $env:RUNNER_TEMP 'nestlink-node-relay-metadata-tests.log'
          cargo test --locked -p nestlink-storage -p nestlink-sdk --test node_relay_attributes --no-fail-fast -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $metadataLog
          exit $LASTEXITCODE
      - name: Check relay metadata migration and HTTP SDK with the ordinary Windows token
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $metadataLog = Join-Path $env:RUNNER_TEMP 'nestlink-node-relay-metadata-tests.log'
          python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-storage -p nestlink-sdk --test node_relay_attributes --no-fail-fast -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $metadataLog
          exit $LASTEXITCODE
      - name: Check original-session quality projection and old IPC compatibility
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $qualityLog = Join-Path $env:RUNNER_TEMP 'nestlink-native-quality-tests.log'
          if ($env:RUNNER_OS -eq 'Windows') {
            python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-app-core --lib runtime::native_quality::tests:: -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $qualityLog
          } else {
            cargo test --locked -p nestlink-app-core --lib runtime::native_quality::tests:: -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $qualityLog
          }
          exit $LASTEXITCODE
      - name: Check private Web launch boundaries and retained redacted native diagnostics
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $accessLog = Join-Path $env:RUNNER_TEMP 'nestlink-private-web-and-diagnostic-tests.log'
          $accessTests = @(
            @{ Args = @('-p', 'nestlink-sdk', '--lib', 'services::web_gateway::') },
            @{ Args = @('-p', 'nestlink-sdk', '--lib', 'services::web_launch::') },
            @{ Args = @('-p', 'nestlink-desktop', '--lib', 'network_diagnostics::tests::') },
            @{ Args = @('-p', 'nestlink-daemon', '--bin', 'nestlink-daemon', 'diagnostics::') }
          )
          $accessFailure = 0
          foreach ($accessTest in $accessTests) {
            $accessArguments = @('test', '--locked') + $accessTest.Args + @('--', '--show-output', '--test-threads=1', '--color', 'never')
            if ($env:RUNNER_OS -eq 'Windows') {
              python scripts/refactor-windows-normal-user.py cargo @accessArguments 2>&1 | Tee-Object -FilePath $accessLog -Append
            } else {
              cargo @accessArguments 2>&1 | Tee-Object -FilePath $accessLog -Append
            }
            if ($LASTEXITCODE -ne 0) { $accessFailure = 1 }
          }
          exit $accessFailure
      - name: Check explicit PCP policy, component ownership and historical local settings
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $pcpLog = Join-Path $env:RUNNER_TEMP 'nestlink-pcp-tests.log'
          $pcpTests = @(
            @{ Args = @('-p', 'nestlink-traversal', '--lib', 'pcp_') },
            @{ Args = @('-p', 'nestlink-sdk', '--lib', 'native::ice::tests') },
            @{ Args = @('-p', 'nestlink-sdk', '--test', 'native_pcp_policy') },
            @{ Args = @('-p', 'nestlink-app-core', '--lib', 'native_session::tests') },
            @{ Args = @('-p', 'nestlink-app-core', '--test', 'native_network_settings') },
            @{ Args = @('-p', 'nestlink-daemon', '--test', 'native_stream_stdio') },
            @{ Args = @('-p', 'nestlink-daemon', '--bin', 'nestlink-daemon', 'private_service_proxy::host::tests::') },
            @{ Args = @('-p', 'nestlink-server', '--test', 'native_pcp_config') }
          )
          $pcpFailure = 0
          foreach ($pcpTest in $pcpTests) {
            $pcpArguments = @('test', '--locked') + $pcpTest.Args + @('--', '--show-output', '--test-threads=1', '--color', 'never')
            if ($env:RUNNER_OS -eq 'Windows') {
              python scripts/refactor-windows-normal-user.py cargo @pcpArguments 2>&1 | Tee-Object -FilePath $pcpLog -Append
            } else {
              cargo @pcpArguments 2>&1 | Tee-Object -FilePath $pcpLog -Append
            }
            if ($LASTEXITCODE -ne 0) { $pcpFailure = 1 }
          }
          exit $pcpFailure
      - name: Check explicit relay selection through the original native owner on Linux
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: pwsh
        run: |
          $selectionLog = Join-Path $env:RUNNER_TEMP 'nestlink-selected-relay-tests.log'
          cargo test --locked -p nestlink-sdk --test node_relay selected_relay:: -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $selectionLog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nestlink-app-core --lib action::tests:: -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $selectionLog -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nestlink-app-core --test native_session app_core_owns_proved_session_and_revocation_waits_for_cleanup -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $selectionLog -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nestlink-storage --test control relay_candidates:: -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $selectionLog -Append
          exit $LASTEXITCODE
      - name: Check explicit relay selection through the original owner with the ordinary Windows token
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $selectionLog = Join-Path $env:RUNNER_TEMP 'nestlink-selected-relay-tests.log'
          python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-sdk --test node_relay selected_relay:: -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $selectionLog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-app-core --lib action::tests:: -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $selectionLog -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-app-core --test native_session app_core_owns_proved_session_and_revocation_waits_for_cleanup -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $selectionLog -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-storage --test control relay_candidates:: -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $selectionLog -Append
          exit $LASTEXITCODE
      - name: Prove mature ICE and Quinn same-socket feasibility on Linux
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.sdk_routed_linux.outcome != 'skipped' }}
        shell: pwsh
        run: |
          $iceLog = Join-Path $env:RUNNER_TEMP 'nestlink-ice-quic-tests.log'
          cargo test --locked -p nestlink-sdk --test ice_quic -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $iceLog
          exit $LASTEXITCODE
      - name: Prove mature ICE and Quinn same-socket feasibility with the ordinary Windows token
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.sdk_routed_windows.outcome != 'skipped' }}
        shell: pwsh
        run: |
          $iceLog = Join-Path $env:RUNNER_TEMP 'nestlink-ice-quic-tests.log'
          python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-sdk --test ice_quic -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $iceLog
          exit $LASTEXITCODE
      - name: Check production signed native sessions on Linux before formatting
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: pwsh
        run: |
          $nativeLog = Join-Path $env:RUNNER_TEMP 'nestlink-native-session-tests.log'
          cargo test --locked -p nestlink-sdk --test native_session -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $nativeLog
          exit $LASTEXITCODE
      - name: Check production signed native sessions with the ordinary Windows token before formatting
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $nativeLog = Join-Path $env:RUNNER_TEMP 'nestlink-native-session-tests.log'
          python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-sdk --test native_session -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $nativeLog
          exit $LASTEXITCODE
      - name: Check production native host inbox on Linux before formatting
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: pwsh
        run: |
          $inboxLog = Join-Path $env:RUNNER_TEMP 'nestlink-native-inbox-tests.log'
          cargo test --locked -p nestlink-app-core --test native_inbox -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $inboxLog
          exit $LASTEXITCODE
      - name: Check production native host inbox with the ordinary Windows token before formatting
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $inboxLog = Join-Path $env:RUNNER_TEMP 'nestlink-native-inbox-tests.log'
          python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-app-core --test native_inbox -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $inboxLog
          exit $LASTEXITCODE
      - name: Check candidate discovery and network lifecycle on Linux before formatting
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.sdk_routed_linux.outcome != 'skipped' }}
        shell: pwsh
        run: |
          $discoveryLog = Join-Path $env:RUNNER_TEMP 'nestlink-network-discovery-tests.log'
          cargo test --locked -p nestlink-sdk --lib discovery:: -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $discoveryLog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nestlink-sdk --lib native::dual_stack::tests:: -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $discoveryLog -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nestlink-platform-network --lib -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $discoveryLog -Append
          exit $LASTEXITCODE
      - name: Check candidate discovery and network lifecycle with the ordinary Windows token before formatting
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.sdk_routed_windows.outcome != 'skipped' }}
        shell: pwsh
        run: |
          $discoveryLog = Join-Path $env:RUNNER_TEMP 'nestlink-network-discovery-tests.log'
          python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-sdk --lib discovery:: -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $discoveryLog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-sdk --lib native::dual_stack::tests:: -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $discoveryLog -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-platform-network --lib -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $discoveryLog -Append
          exit $LASTEXITCODE
      - name: Check actual space storage and HTTP SDK delegation on Linux before formatting
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.sdk_routed_linux.outcome != 'skipped' }}
        shell: pwsh
        run: |
          $spacesLog = Join-Path $env:RUNNER_TEMP 'nestlink-spaces-tests.log'
          cargo test --locked -p nestlink-storage --test spaces -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $spacesLog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p nestlink-sdk --test spaces -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $spacesLog -Append
          exit $LASTEXITCODE
      - name: Check actual space storage and HTTP SDK delegation with the ordinary Windows token before formatting
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.sdk_routed_windows.outcome != 'skipped' }}
        shell: pwsh
        run: |
          $spacesLog = Join-Path $env:RUNNER_TEMP 'nestlink-spaces-tests.log'
          python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-storage --test spaces -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $spacesLog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/refactor-windows-normal-user.py cargo test --locked -p nestlink-sdk --test spaces -- --show-output --test-threads=1 --color never 2>&1 | Tee-Object -FilePath $spacesLog -Append
          exit $LASTEXITCODE
      - name: Check actual space address, DNS transports and shared daemon singleton
        if: ${{ !cancelled() }}
