              'hevc_product_support_claimed': False,
              'physical_capture': False,
              'scanout_verified': False,
              'performance_qualified': False,
              'source_files': [
                  {'path': name, 'sha256': hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()}
                  for name in source_paths
              ],
          }
          (output / 'hevc-probe-build.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
      - name: Retain the separate exact-source HEVC target diagnostic
        if: runner.os == 'Windows'
