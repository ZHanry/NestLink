          if revision != os.environ['GITHUB_SHA']:
              raise SystemExit('HEVC diagnostic source revision differs from this workflow run')
          source_paths = [
              'Cargo.lock', 'rust-toolchain.toml', 'docs/refactor/native-codecs.lock.json',
              'crates/media-codec/Cargo.toml', 'crates/media-codec/build.rs',
