name: Network rewrite contract checks

on:
  push:
    branches: [main]
    paths:
      - "Cargo.*"
      - "rust-toolchain.toml"
      - "compatibility.json"
      - "crates/**"
      - "third-party/**"
      - "protocol-spec/**"
      - "apps/server/**"
      - "apps/web/**"
      - "docs/network-rewrite/**"
      - "config/network-*.json"
      - "config/product-scope.json"
      - "scripts/network-rewrite*"
      - "scripts/refactor-windows-normal-user.py"
      - "tests/network/**"
      - ".github/workflows/network-rewrite.yml"
  pull_request:
    paths:
      - "Cargo.*"
      - "rust-toolchain.toml"
      - "compatibility.json"
      - "crates/**"
      - "third-party/**"
      - "protocol-spec/**"
      - "apps/server/**"
      - "apps/web/**"
      - "docs/network-rewrite/**"
      - "config/network-*.json"
      - "config/product-scope.json"
      - "scripts/network-rewrite*"
      - "scripts/refactor-windows-normal-user.py"
      - "tests/network/**"
      - ".github/workflows/network-rewrite.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-rewrite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  topology-journal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
      - name: Exercise topology signatures, publication ACL and durable SQLite history
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-protocol -p nestlink-identity -p nestlink-storage --test network_topology -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-topology-tests.log"
      - name: Exercise atomic two-relay quota, device proof, topology and rollback
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-storage --test control network_paths::chains:: -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-chain-reservation-tests.log"
      - name: Exercise the real HTTP topology publication and withdrawal APIs
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-server --test network_policy topology:: -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-topology-http-tests.log"
          cargo test --locked -p nestlink-server --test network_policy chains:: -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-chain-http-tests.log"
          cargo test --locked -p nestlink-server --test network_policy route_exports:: -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-route-export-http-tests.log"
          cargo test --locked -p nestlink-server --lib node_quic::prefixes:: -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-local-prefix-config-tests.log"
      - name: Retain exact-source topology journal and admission logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-topology-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/network-topology-tests.log
            ${{ runner.temp }}/network-chain-reservation-tests.log
            ${{ runner.temp }}/network-topology-http-tests.log
            ${{ runner.temp }}/network-chain-http-tests.log
            ${{ runner.temp }}/network-route-export-http-tests.log
            ${{ runner.temp }}/network-local-prefix-config-tests.log
          if-no-files-found: error
          retention-days: 30
      - name: Exercise atomic original-group candidates and current per-node authority
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-storage --test control network_paths::route_sets:: -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-route-set-storage-tests.log"
          cargo test --locked -p nestlink-server --test network_policy route_sets:: -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-route-set-http-tests.log"
      - name: Exercise identity-bound stable address directory and atomic changes
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-storage --test spaces addressing:: -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-space-address-storage-tests.log"
      - name: Retain exact-source route-set and address directory admission logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-route-set-directory-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/network-route-set-storage-tests.log
            ${{ runner.temp }}/network-route-set-http-tests.log
            ${{ runner.temp }}/network-space-address-storage-tests.log
          if-no-files-found: error
          retention-days: 30
  topology-carrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
      - name: Exercise the verified bounded graph and both datagram wire versions
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-connectivity --test topology -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-topology-graph-tests.log"
          cargo test --locked -p nestlink-protocol --test network_datagram_v2 -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-datagram-v2-tests.log"
      - name: Exercise actual four-node NRD2 and retained NRD1 carrier behavior
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-transport-quic --lib routed:: -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-chain-carrier-tests.log"
      - name: Exercise live local quality observations and original carrier ownership
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-connectivity --lib observation:: -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-path-observation-policy-tests.log"
          cargo test --locked -p nestlink-connectivity --lib continuation:: -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-continuation-policy-tests.log"
          cargo test --locked -p nestlink-remote --lib local_path_observation -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-path-observation-quic-tests.log"
      - name: Exercise generic service framing, ALPN isolation and original physical receipts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-transport-quic --lib service:: -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-service-carrier-tests.log"
      - name: Exercise node report authority, cancellation and original deadlines
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-node --lib control::topology:: -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-topology-reporter-tests.log"
      - name: Exercise explicit host-prefix consent, real TCP observations and signed withdrawal
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-node --lib control::prefix:: -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-host-prefix-tests.log"
      - name: Exercise full-chain node admission, shared meters and live snapshot withdrawal
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-node --lib control::resources::tests::network:: -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-node-chain-admission-tests.log"
          cargo test --locked -p nestlink-node --lib control::resources::tests::topology:: -- --show-output --color never 2>&1 | tee "$RUNNER_TEMP/network-node-topology-authority-tests.log"
      - name: Retain exact-source topology test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-topology-carrier-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/network-topology-graph-tests.log
            ${{ runner.temp }}/network-datagram-v2-tests.log
            ${{ runner.temp }}/network-topology-reporter-tests.log
            ${{ runner.temp }}/network-host-prefix-tests.log
            ${{ runner.temp }}/network-chain-carrier-tests.log
            ${{ runner.temp }}/network-service-carrier-tests.log
            ${{ runner.temp }}/network-path-observation-policy-tests.log
            ${{ runner.temp }}/network-continuation-policy-tests.log
            ${{ runner.temp }}/network-path-observation-quic-tests.log
            ${{ runner.temp }}/network-node-chain-admission-tests.log
            ${{ runner.temp }}/network-node-topology-authority-tests.log
          if-no-files-found: error
          retention-days: 30
  native-ice-kernel-nat-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
          components: clippy
      - name: Set the existing SDK native codec location
        shell: bash
        run: echo "NESTLINK_CODEC_PREFIX=${{ runner.temp }}/nestlink-codecs/x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
      - name: Prepare existing SDK native build inputs
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build nasm pkg-config dbus libpipewire-0.3-dev pipewire-bin
      - name: Build and verify the locked existing native codecs on GitHub
        run: |
          python scripts/refactor-native-codecs.py build --target x86_64-unknown-linux-gnu --cache-dir "${{ runner.temp }}/nestlink-codec-sources" --work-dir "${{ runner.temp }}/nestlink-codecs"
          python scripts/refactor-native-codecs.py verify --target x86_64-unknown-linux-gnu --prefix "${{ env.NESTLINK_CODEC_PREFIX }}"
      - name: Exercise production signed native ICE, Quinn and FileRead across two kernel NATs
        run: python -B scripts/network-rewrite-native-ice.py --output "${{ runner.temp }}/network-native-ice-evidence"
      - name: Exercise NRD2 SDK business proof and approved OS file reads
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-sdk --lib network::routed::tests::chain:: -- --show-output --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/network-chain-sdk-tests.log"
      - name: Exercise registered NRD2 nodes through management and the production listener
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-sdk --test network_relay chain:: -- --show-output --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/network-chain-registered-tests.log"
      - name: Exercise actual route-set SDK node admission and space address APIs
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-sdk --test network_relay route_sets:: -- --show-output --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/network-route-set-sdk-tests.log"
      - name: Exercise actual space address HTTP SDK APIs
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-sdk --test space_addressing -- --show-output --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/network-space-address-sdk-tests.log"
      - name: Exercise private HTTP TCP UDP access, shared accounting and revocation
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-sdk --test private_services -- --show-output --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/network-private-service-sdk-tests.log"
      - name: Exercise product original-route recovery, old input release and fresh video
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-app-core --test native_session route_set:: -- --show-output --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/network-route-set-product-tests.log"
      - name: Exercise public service original consent, half-close and physical teardown
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-sdk --lib services::publication:: -- --show-output --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/network-service-publication-owner-tests.log"
          cargo test --locked -p nestlink-sdk --test service_publication -- --show-output --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/network-service-publication-sdk-tests.log"
          cargo test --locked -p nestlink-sdk --test service_start_cancellation -- --show-output --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/network-service-start-cancellation-tests.log"
      - name: Exercise restricted SOCKS authentication, credential secrecy and owner cleanup
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-sdk --lib services::local_proxy::tests:: -- --show-output --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/network-local-proxy-tests.log"
      - name: Exercise application management ownership and dynamic TLS admission boundaries
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-app-core --lib runtime::native_routed::tests:: -- --show-output --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/network-product-owner-tests.log"
          cargo test --locked -p nestlink-transport-quic --lib routed::tests::node_admission:: -- --show-output --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/network-node-admission-tests.log"
      - name: Retain exact-source SDK and registered-chain business logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-chain-business-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/network-chain-sdk-tests.log
            ${{ runner.temp }}/network-chain-registered-tests.log
            ${{ runner.temp }}/network-route-set-sdk-tests.log
            ${{ runner.temp }}/network-space-address-sdk-tests.log
            ${{ runner.temp }}/network-private-service-sdk-tests.log
            ${{ runner.temp }}/network-route-set-product-tests.log
            ${{ runner.temp }}/network-service-publication-owner-tests.log
            ${{ runner.temp }}/network-service-publication-sdk-tests.log
            ${{ runner.temp }}/network-service-start-cancellation-tests.log
            ${{ runner.temp }}/network-local-proxy-tests.log
            ${{ runner.temp }}/network-product-owner-tests.log
            ${{ runner.temp }}/network-node-admission-tests.log
          if-no-files-found: error
          retention-days: 30
      - name: Retain original tuples, STUN mapping, business bytes and physical cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-native-ice-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-native-ice-evidence/
          if-no-files-found: error
          retention-days: 30
  routed-kernel-nat-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
          components: clippy
      - name: Exercise three isolated QUIC processes through two actual kernel NAT gateways
        run: python -B scripts/network-rewrite-routed.py --output "${{ runner.temp }}/nestlink-network-routed"
      - name: Retain NAT tuples, packet captures, source identity and cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-routed-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nestlink-network-routed/
          if-no-files-found: error
          retention-days: 30
  quinn-carrier-replacement-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
          components: clippy
      - name: Measure one inner Quinn connection across two authorized real carriers
        run: python -B scripts/network-rewrite-migration.py --output "${{ runner.temp }}/network-migration-evidence"
      - name: Retain explicit role execution, connection identity, kernel damage and cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-migration-feasibility-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-migration-evidence/
          if-no-files-found: error
          retention-days: 30
  production-socket-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
          components: clippy
      - name: Exercise production mutual proof and FileRead with actual kernel packet faults
        run: python -B scripts/network-rewrite-socket.py --output "${{ runner.temp }}/nestlink-network-socket"
      - name: Retain packet captures, process logs, source identity and partial coverage receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-socket-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nestlink-network-socket/
          if-no-files-found: error
          retention-days: 30
  independent-vectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Derive independent Ed25519 and canonical claims vectors on GitHub
        run: node scripts/network-rewrite-vectors.cjs "${{ runner.temp }}/nestlink-network-reference"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-reference-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nestlink-network-reference/
          if-no-files-found: error
          retention-days: 30
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - name: Prepare existing build inputs for the ordinary Windows test token
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $networkTestSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $networkTestTemp = Join-Path $env:RUNNER_TEMP 'nestlink-network-normal-user-temp'
          New-Item -ItemType Directory -Path $networkTestTemp -Force | Out-Null
          $networkTestInputs = @(
            @{ Path = (Join-Path $env:USERPROFILE '.rustup'); Access = 'RX' },
            @{ Path = (Join-Path $env:USERPROFILE '.cargo'); Access = 'M' },
            @{ Path = $env:GITHUB_WORKSPACE; Access = 'M' },
            @{ Path = $networkTestTemp; Access = 'M' }
          )
          foreach ($networkTestInput in $networkTestInputs) {
            & icacls $networkTestInput.Path /grant "*${networkTestSid}:(OI)(CI)$($networkTestInput.Access)" /T /Q
            if ($LASTEXITCODE -ne 0) { throw 'Could not prepare network contract test inputs' }
          }
          "TEMP=$networkTestTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$networkTestTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check exact-source contracts and retain every command result
        run: python -B scripts/network-rewrite-ci.py --output "${{ runner.temp }}/nestlink-network-rewrite-${{ matrix.os }}"
      - name: Retain validation logs, provenance and the Actions-generated formatting patch
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-rewrite-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nestlink-network-rewrite-${{ matrix.os }}/
          if-no-files-found: error
          retention-days: 30
