name: Android

on:
  push:
    paths:
      - "apps/android/**"
      - "crates/android-bridge/**"
      - "crates/sdk/**"
      - "crates/**"
      - ".github/workflows/android.yml"
      - "rust-toolchain.toml"
      - "protocol-spec/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/refactor-native-codecs.py"
      - "scripts/verify-android-binary.py"
      - "docs/refactor/native-codecs.lock.json"
      - "config/ui-tokens.json"
      - "scripts/refactor-ui-tokens.py"
  pull_request:
    paths:
      - "apps/android/**"
      - "crates/android-bridge/**"
      - "crates/sdk/**"
      - "crates/**"
      - ".github/workflows/android.yml"
      - "rust-toolchain.toml"
      - "protocol-spec/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/refactor-native-codecs.py"
      - "scripts/verify-android-binary.py"
      - "docs/refactor/native-codecs.lock.json"
      - "config/ui-tokens.json"
      - "scripts/refactor-ui-tokens.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kotlin-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.13"
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      # JVM checks do not package or publish JNI bytes. The matrix below still
      # requires verified native builds before making APKs and running devices.
      - run: gradle -p apps/android --no-daemon compileDebugKotlin testDebugUnitTest -x preBuild

  native-codecs:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - name: Check generated cross-platform UI tokens
        run: python3 scripts/refactor-ui-tokens.py --check
      - name: Install native build tools and pinned NDK
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build nasm perl
          sdkmanager "ndk;27.2.12479018"
      - name: Build and verify both Android codec prefixes
        run: |
          set -euo pipefail
          cache="${RUNNER_TEMP}/nestlink-codec-sources"
          python3 scripts/refactor-native-codecs.py fetch --cache-dir "$cache"
          for target in aarch64-linux-android x86_64-linux-android; do
            work="${RUNNER_TEMP}/nestlink-codecs-${target}"
            python3 scripts/refactor-native-codecs.py build \
              --target "$target" \
              --work-dir "$work" \
              --cache-dir "$cache" \
              --ndk "$ANDROID_HOME/ndk/27.2.12479018" \
              --jobs 4
            python3 scripts/refactor-native-codecs.py verify \
              --target "$target" \
              --prefix "$work/$target"
          done
          mkdir -p "${RUNNER_TEMP}/android-codec-prefixes/arm64-v8a" "${RUNNER_TEMP}/android-codec-prefixes/x86_64"
          cp -a "${RUNNER_TEMP}/nestlink-codecs-aarch64-linux-android/aarch64-linux-android/." "${RUNNER_TEMP}/android-codec-prefixes/arm64-v8a/"
          cp -a "${RUNNER_TEMP}/nestlink-codecs-x86_64-linux-android/x86_64-linux-android/." "${RUNNER_TEMP}/android-codec-prefixes/x86_64/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-codec-prefixes
          path: ${{ runner.temp }}/android-codec-prefixes
          if-no-files-found: error
          retention-days: 1

  debug-build:
    needs: native-codecs
    strategy:
      fail-fast: false
      matrix:
        # API 30 is the declared minimum (Android 11); API 29 is intentionally
        # outside the product target. Exercise every supported Android API.
        api-level: [30, 31, 32, 33, 34, 35, 36]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.96.0"
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install pinned Android SDK and NDK
        run: sdkmanager "emulator" "platforms;android-36" "build-tools;36.0.0" "system-images;android-${{ matrix.api-level }};google_apis;x86_64" "ndk;27.2.12479018"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.1
        with:
          name: android-codec-prefixes
          path: ${{ runner.temp }}/android-codec-prefixes
      - name: Verify Android codec receipts
        run: |
          python3 scripts/refactor-native-codecs.py verify \
            --target aarch64-linux-android \
            --prefix "${RUNNER_TEMP}/android-codec-prefixes/arm64-v8a"
          python3 scripts/refactor-native-codecs.py verify \
            --target x86_64-linux-android \
            --prefix "${RUNNER_TEMP}/android-codec-prefixes/x86_64"
      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked
      - name: Start Android emulator
        timeout-minutes: 10
        run: |
          set -euo pipefail
          api_level="${{ matrix.api-level }}"
          export ANDROID_USER_HOME="${RUNNER_TEMP}/nestlink-android-user"
          export ANDROID_AVD_HOME="${ANDROID_USER_HOME}/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          echo "no" | avdmanager create avd --force --name "nestlink-api${api_level}" --path "${ANDROID_AVD_HOME}/nestlink-api${api_level}.avd" --package "system-images;android-${api_level};google_apis;x86_64" --device pixel_2
          test -s "${ANDROID_AVD_HOME}/nestlink-api${api_level}.ini"
          emulator_log="${RUNNER_TEMP}/nestlink-emulator.log"
          "$ANDROID_HOME/emulator/emulator" -avd "nestlink-api${api_level}" -no-window -no-audio -no-snapshot-save -no-boot-anim -gpu swiftshader_indirect > "$emulator_log" 2>&1 &
          emulator_pid=$!
          if ! timeout 180 adb wait-for-device; then
            tail -n 100 "$emulator_log"
            exit 1
          fi
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              tail -n 100 "$emulator_log"
              exit 1
            fi
            boot_completed="$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$boot_completed" = "1" ]; then
              break
            fi
            sleep 2
          done
          if [ "$boot_completed" != "1" ]; then
            tail -n 100 "$emulator_log"
            exit 1
          fi
      - name: Build Android debug APK and run emulator tests
        env:
          NESTLINK_CODEC_ARM64_PREFIX: ${{ runner.temp }}/android-codec-prefixes/arm64-v8a
          NESTLINK_CODEC_X86_64_PREFIX: ${{ runner.temp }}/android-codec-prefixes/x86_64
        run: bash apps/android/gradlew -p apps/android :app:assembleDebug :app:testDebugUnitTest :app:connectedDebugAndroidTest --no-daemon --max-workers=4
      - name: Verify final JNI and APK 16 KiB alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 apps/android/app/build/outputs/apk/debug/app-debug.apk
