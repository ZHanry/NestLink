name: Linux raw private service UID gate

on:
  push:
    branches: [main]
    paths:
      - "Cargo.*"
      - "crates/**"
      - "apps/server/**"
      - "scripts/network-rewrite-local-port-gate.py"
      - ".github/workflows/local-port-gate.yml"
  pull_request:
    paths:
      - "Cargo.*"
      - "crates/**"
      - "apps/server/**"
      - "scripts/network-rewrite-local-port-gate.py"
      - ".github/workflows/local-port-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-port-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-sdk-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      NESTLINK_RAW_KERNEL_GATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
      - name: Prepare existing native dependencies and actual kernel nft tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm pkg-config dbus libpipewire-0.3-dev pipewire-bin nftables util-linux
      - name: Set existing codec location
        run: echo "NESTLINK_CODEC_PREFIX=${{ runner.temp }}/nestlink-codecs/x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
      - name: Build the locked existing native codecs
        run: python3 scripts/refactor-native-codecs.py build --target x86_64-unknown-linux-gnu --cache-dir "${{ runner.temp }}/nestlink-codec-sources" --work-dir "${{ runner.temp }}/nestlink-codecs"
      - name: Verify existing codec provenance
        run: python3 scripts/refactor-native-codecs.py verify --target x86_64-unknown-linux-gnu --prefix "$NESTLINK_CODEC_PREFIX"
      - name: Exercise ordinary SDK, distinct UID probes and root gate lifecycle
        run: python3 -B scripts/network-rewrite-local-port-gate.py --output "${{ runner.temp }}/local-port-gate-evidence"
      - name: Exercise ordinary-user receipt, plan and recovery boundaries
        if: ${{ !cancelled() }}
        run: cargo test --locked -p nestlink-platform-security --lib local_port_gate::tests:: -- --show-output --test-threads=1 --color never
      - name: Retain exact source, kernel handles, byte witnesses and cleanup receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-port-gate-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/local-port-gate-evidence/
          if-no-files-found: error
          retention-days: 30
