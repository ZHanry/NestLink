name: Network authorized service capacity
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Explicit carrier mode; independent-grant failure records remain retained
        type: choice
        options: [independent, multiplexed]
        default: independent
      profile:
        description: Explicit build profile; debug failures remain separate evidence
        type: choice
        options: [debug, release]
        default: debug
      schedule:
        description: Explicit opening schedule; original pair-window failures remain retained
        type: choice
        options: [pair-windows, origin-window]
        default: pair-windows
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_BACKTRACE: "1"
      CAPACITY_MODE: ${{ inputs.mode }}
      CAPACITY_PROFILE: ${{ inputs.profile }}
      CAPACITY_SCHEDULE: ${{ inputs.schedule }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
          components: clippy
      - name: Prepare original locked native components on GitHub
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm pkg-config dbus libpipewire-0.3-dev pipewire-bin
          echo "NESTLINK_CODEC_PREFIX=$RUNNER_TEMP/capacity-codecs/x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
          python3 -B scripts/refactor-native-codecs.py build --target x86_64-unknown-linux-gnu --cache-dir "$RUNNER_TEMP/codec-sources" --work-dir "$RUNNER_TEMP/capacity-codecs"
          python3 -B scripts/refactor-native-codecs.py verify --target x86_64-unknown-linux-gnu --prefix "$RUNNER_TEMP/capacity-codecs/x86_64-unknown-linux-gnu"
      - name: Build and attempt original authorized service capacity with complete failure records
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, subprocess, time
          assert os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted'
          output = pathlib.Path(os.environ['RUNNER_TEMP'])/'network-capacity'
          output.mkdir()
          source = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert source == os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all']) == b''
          receipt = {'source_revision':source,'workflow':os.environ['GITHUB_WORKFLOW_REF'],
            'workflow_revision':os.environ['GITHUB_WORKFLOW_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
            'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'runner_environment':os.environ['RUNNER_ENVIRONMENT'],
            'runner_os':os.environ['RUNNER_OS'],'kernel':list(os.uname()),
            'cargo_lock_sha256':hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest(),
            'offered_load':{'registered_installations_in_one_space':100,'active_pairs':20,'simultaneous_flows':1000,'reconnect_waves':3},
            'scope':'Original HTTP management and signed grants, actual kernel QUIC/TCP targets, original limits and four-scope durable accounting. One independent management login per active consumer, unchanged original rate limits.',
            'limitations':['one hosted process; not physical nodes or independently deployed relay runtimes',
              'short-run samples cannot qualify cross-day soak, complete E2E or all bounded queues'],
            'passed':False,'commands':[]}
          mode = os.environ['CAPACITY_MODE']
          assert mode in ('independent','multiplexed')
          profile = os.environ['CAPACITY_PROFILE']
          assert profile in ('debug','release')
          cargo_profile = ['--release'] if profile == 'release' else []
          receipt['build_profile'] = profile
          schedule = os.environ['CAPACITY_SCHEDULE']
          assert schedule in ('pair-windows', 'origin-window')
          assert schedule != 'origin-window' or mode == 'multiplexed'
          receipt['opening_schedule'] = schedule
          receipt['original_assertions_and_deadlines_preserved'] = True
          receipt['load_mode'] = mode
          receipt['offered_load']['management_logins_per_active_consumer'] = 1
          receipt['offered_load']['streams_per_pair'] = 50
          receipt['offered_load']['same_lease_control_owners_per_wave'] = 20 if mode == 'multiplexed' else 1000
          def execute(name, command, timeout):
              started = time.monotonic()
              record = {'name':name,'argv':command,'timeout_seconds':timeout,'return_code':None,'timed_out':False}
              receipt['commands'].append(record)
              try:
                  with (output/(name+'.log')).open('wb') as stream, (output/(name+'.stderr.log')).open('wb') as errors:
                      result = subprocess.run(command,stdout=stream,stderr=errors,timeout=timeout)
                  record['return_code'] = result.returncode
                  assert result.returncode == 0, name+' failed; original failure retained'
              except subprocess.TimeoutExpired:
                  record['timed_out'] = True
                  raise
              finally:
                  record['seconds'] = time.monotonic()-started
          def execute_tests(name, command, timeout, expected):
              execute(name, command, timeout)
              summaries = re.findall(r'test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;', (output/(name+'.log')).read_text())
              assert summaries == [(str(expected),'0','0')], name+' exact executed inventory differs'
          try:
              os.environ['NESTLINK_CAPACITY_SAMPLES'] = str(output/'samples.jsonl')
              execute('build-currentness',['cargo','test',*cargo_profile,'--locked','-p','nestlink-storage','--lib','--no-run','--message-format=json-render-diagnostics'],1200)
              currentness = [item['executable'] for line in (output/'build-currentness.log').read_text().splitlines()
                if (item:=json.loads(line)).get('reason')=='compiler-artifact'
                and item.get('executable') and item['target']['name']=='nestlink_storage']
              assert len(currentness)==1, 'exact currentness harness missing'
              receipt['currentness_executable_sha256'] = hashlib.sha256(pathlib.Path(currentness[0]).read_bytes()).hexdigest()
              execute_tests('currentness-authority',[currentness[0],'combined_private_currentness_keeps_original_bytes_and_rejects_tamper_expiry_and_revoke','--show-output'],60,1)
              # Compile every harness under the original build budget. Test
              # execution budgets must not accidentally include release LTO.
              execute('build',['cargo','test',*cargo_profile,'--locked','-p','nestlink-sdk','--lib','--test','capacity','--test','private_services','--no-run','--message-format=json-render-diagnostics'],1200)
              artifacts = [item for line in (output/'build.log').read_text().splitlines()
                if (item:=json.loads(line)).get('reason')=='compiler-artifact' and item.get('executable')]
              executables = {}
              for name in ('nestlink_sdk','capacity','private_services'):
                  matches = [item['executable'] for item in artifacts if item['target']['name']==name]
                  assert len(matches)==1, (name,matches)
                  executables[name] = pathlib.Path(matches[0])
              receipt['test_executables'] = {name: {'path':str(path),'sha256':hashlib.sha256(path.read_bytes()).hexdigest()} for name,path in executables.items()}
              executable = executables['capacity']
              receipt['executable_sha256'] = hashlib.sha256(executable.read_bytes()).hexdigest()
              execute_tests('native-http-backpressure',[str(executables['nestlink_sdk']),'http_admission::tests::','--show-output','--test-threads=1'],180,7)
              if mode == 'multiplexed':
                  execute_tests('explicit-negotiation',[str(executables['nestlink_sdk']),'explicit_negotiation_preserves_legacy_wire_and_old_host_refusal','--show-output'],300,1)
                  execute_tests('multiplex-original-owners',[str(executables['private_services']),'multiplex::','--show-output','--test-threads=1'],300,6)
              case = 'hundred_enrolled_nodes_twenty_pairs_thousand_'+('multiplexed' if mode == 'multiplexed' else 'simultaneous')+'_authorized_streams'
              if schedule == 'origin-window':
                  case = 'hundred_enrolled_nodes_twenty_pairs_thousand_multiplexed_shared_origin_ramp'
              execute_tests('execution',[str(executable),'--exact',case,'--ignored','--nocapture','--test-threads=1'],660,1)
              execute('strict-capacity',['cargo','clippy',*cargo_profile,'--locked','-p','nestlink-sdk','--test','capacity','--test','private_services','--','-D','warnings'],300)
              receipt['passed'] = True
          except BaseException as error:
              receipt['failure'] = repr(error)
              raise
          finally:
              receipt['files'] = [{'path':str(p.relative_to(output)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
                for p in sorted(output.rglob('*')) if p.is_file()]
              (output/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
      - name: Retain same-source provenance, actual samples and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-capacity-${{ inputs.mode }}-${{ inputs.profile }}-${{ inputs.schedule }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-capacity/
          if-no-files-found: error
          retention-days: 30
