name: Review network source formatting

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact main revision to format into a reviewable patch
        required: true
        type: string

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_revision }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - name: Generate formatting patch with exact source receipts
        shell: python
        env:
          EXPECTED_SOURCE: ${{ inputs.source_revision }}
        run: |
          import hashlib, json, os, pathlib, re, subprocess
          expected = os.environ['EXPECTED_SOURCE']
          assert re.fullmatch('[0-9a-f]{40}', expected)
          assert os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted'
          assert expected == os.environ['GITHUB_SHA'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert subprocess.check_output(['git', 'status', '--porcelain=v1', '--untracked-files=all']) == b''
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'network-source-format'
          output.mkdir()
          command = ['python', '-B', 'scripts/format-first-party.py', '--receipt', str(output / 'formatter-commands.json')]
          with (output / 'rustfmt.log').open('wb') as stream:
              result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT, check=False)
          (output / 'rustfmt.patch').write_bytes(subprocess.check_output(['git', 'diff', '--binary', '--no-ext-diff']))
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert all(path.endswith('.rs') and not path.startswith('third-party/') for path in changed)
          receipt = {
              'source_revision': expected, 'workflow': os.environ['GITHUB_WORKFLOW_REF'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'runner_environment': os.environ['RUNNER_ENVIRONMENT'], 'runner_os': os.environ['RUNNER_OS'],
              'command': command, 'return_code': result.returncode,
              'formatter_commands': json.loads((output / 'formatter-commands.json').read_text()),
              'changed_paths': changed, 'quality_or_acceptance_claimed': False,
              'files': [{'path': path.name, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                         'bytes': path.stat().st_size} for path in sorted(output.iterdir())],
          }
          (output / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          assert result.returncode == 0, 'Formatting failed; retained logs and any partial patch are not qualified'
      - name: Retain hosted formatting output for local review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-source-format-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-source-format/
          if-no-files-found: error
          retention-days: 30
