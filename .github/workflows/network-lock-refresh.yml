name: Derive reviewed network dependency locks

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact main source containing the reviewed network component manifests
        required: true
        type: string

permissions:
  contents: read

jobs:
  derive-lock:
    strategy:
      fail-fast: false
      matrix:
        scope: [product, browser-native-fixture]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: ${{ inputs.source_revision }}
      LOCK_SCOPE: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
      - name: Resolve only the reviewed manifest additions on GitHub and retain provenance
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, shutil, subprocess, tomllib

          assert os.environ['GITHUB_REPOSITORY'] == 'ZHanry/NestLink'
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          assert os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted'
          expected = os.environ['EXPECTED_SOURCE']
          assert re.fullmatch('[0-9a-f]{40}', expected)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected == os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git', 'status', '--porcelain=v1', '--untracked-files=all']) == b''
          scope = os.environ['LOCK_SCOPE']
          manifest = pathlib.Path({'product': 'Cargo.toml',
                                   'browser-native-fixture': 'scripts/fixtures/browser-native-host/Cargo.toml'}[scope])
          lock = manifest.with_name('Cargo.lock')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / ('network-lock-' + scope)
          output.mkdir()
          traversal = tomllib.loads(pathlib.Path('crates/traversal/Cargo.toml').read_text())
          assert traversal['dependencies']['crab_nat'] == '=0.8.1'
          connectivity = tomllib.loads(pathlib.Path('crates/connectivity/Cargo.toml').read_text())
          assert connectivity['dependencies']['petgraph'] == '=0.8.3'
          assert connectivity['dependencies']['nestlink-identity'] == {'workspace': True}
          sdk = tomllib.loads(pathlib.Path('crates/sdk/Cargo.toml').read_text())
          native = sdk['target']['cfg(not(target_arch = "wasm32"))']['dependencies']
          assert native['hickory-server'] == {'version': '=0.26.3', 'default-features': False}
          assert native['async-trait'] == '=0.1.89'
          assert native['ipnet'] == '=2.12.2'
          assert native['etherparse'] == '=0.21.0'
          daemon = tomllib.loads(pathlib.Path('apps/daemon/Cargo.toml').read_text())
          assert daemon['target']['cfg(target_os = "linux")']['dependencies']['tun-rs'] == {
              'version': '=2.8.16', 'default-features': False, 'features': ['async_tokio']}
          assert daemon['dependencies']['nestlink-transport-quic'] == {'workspace': True}
          assert daemon['dependencies']['nestlink-platform-network'] == {'workspace': True}
          assert daemon['target']['cfg(target_os = "linux")']['dev-dependencies']['etherparse'] == '=0.21.0'
          assert 'fs' in daemon['target']['cfg(unix)']['dependencies']['rustix']['features']
          assert native['fast-socks5'] == {'version': '=1.0.0', 'path': '../../third-party/fast-socks5'}
          security = tomllib.loads(pathlib.Path('crates/platform-security/Cargo.toml').read_text())
          assert security['dependencies']['tokio'] == {'workspace': True, 'features': ['process']}
          assert security['dependencies']['serde'] == {'workspace': True}
          assert security['dependencies']['serde_json'] == {'workspace': True}
          assert security['target']['cfg(unix)']['dependencies']['rustix'] == {
              'version': '1.1.2', 'features': ['process', 'fs']}
          assert security['target']['cfg(windows)']['dependencies']['tokio-util'] == {
              'version': '=0.7.20', 'features': ['io-util']}
          assert {'Win32_Foundation', 'Win32_System_Pipes', 'Win32_System_IO'} <= set(
              security['target']['cfg(windows)']['dependencies']['windows-sys']['features'])
          # Verify original archive, complete source inventory, exact reviewed
          # security patch and MIT attribution before resolving this local crate.
          import importlib.util
          spec = importlib.util.spec_from_file_location('notices', 'scripts/refactor-cargo-notices.py')
          notices = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(notices)
          vendor = pathlib.Path('third-party/fast-socks5').resolve()
          item = tomllib.loads((vendor / 'Cargo.toml').read_text())['package']
          item['license_file'] = item.get('license-file')
          notices.reviewed_local_fork(pathlib.Path.cwd(), vendor, item)
          before_bytes = lock.read_bytes()
          before = tomllib.loads(before_bytes.decode())['package']
          shutil.copyfile(lock, output / 'before.lock')
          identity = lambda item: (item['name'], item['version'], item.get('source', ''))
          existing = {identity(item): item.get('checksum') for item in before}
          commands, assertions, failure = [], {}, None
          try:
              command = ['cargo', 'update', '--workspace', '--manifest-path', str(manifest)]
              with (output / 'command-0.log').open('wb') as stream:
                  result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT, check=False)
              commands.append({'argv': command, 'return_code': result.returncode})
              assert result.returncode == 0, 'Lock command failed; review retained log'
              if scope == 'product':
                  # Reuse the reviewed encoding implementation, without the
                  # new optional SIMD dependency family selected by latest.
                  command = ['cargo', 'update', '-p', 'encoding_rs', '--precise', '0.8.35',
                             '--manifest-path', str(manifest)]
                  with (output / ('command-' + str(len(commands)) + '.log')).open('wb') as stream:
                      result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT, check=False)
                  commands.append({'argv': command, 'return_code': result.returncode})
                  assert result.returncode == 0, 'Reviewed encoding selection failed'
              shutil.copyfile(lock, output / 'cargo-generated.lock')
              # Cargo can reselect an already-locked compatible windows-sys
              # edge even with --workspace. Preserve existing external blocks.
              # Reviewed feature activation by the pinned graph/DNS components.
              # Keep every preexisting identity, checksum and other edge exact.
              def blocks(raw):
                  parts = raw.split('[[package]]')
                  return parts[0], [(identity(tomllib.loads('[[package]]' + part)['package'][0]), part)
                                    for part in parts[1:]]
              _, original_blocks = blocks(before_bytes.decode())
              header, generated_blocks = blocks(lock.read_text())
              if scope == 'product':
                  # Adding a second identity requires Cargo's version selector
                  # on old edges. Keep their exact old package, not the new
                  # compatible-looking provider dependency. No semantic edge
                  # changes are authorized by this textual qualification.
                  for name, version in [('libloading', '0.8.9'), ('nix', '0.26.4')]:
                      assert [item['version'] for item in before if item['name'] == name] == [version]
                      original_blocks = [(key, part.replace('\n "' + name + '",\n',
                          '\n "' + name + ' ' + version + '",\n')) for key, part in original_blocks]
              original_by_key = dict(original_blocks)
              reviewed_feature_edges = {
                  ('petgraph', '0.8.3'): {'serde'},
                  ('ipnet', '2.12.2'): {'serde'},
                  ('once_cell', '1.21.4'): {'critical-section', 'portable-atomic'},
                  ('url', '2.5.8'): {'serde_derive'},
                  # Existing reqwest cookie Jar; only these two optional edges
                  # are activated. New transitive identities are reviewed from
                  # the retained derivation receipt before importing a lock.
                  ('reqwest', '0.12.28'): {'cookie', 'cookie_store'},
              }
              if scope == 'product':
                  # flume's default fairness source activates fastrand's
                  # maintained entropy feature, using the existing identity.
                  assert ('getrandom', '0.4.3', 'registry+https://github.com/rust-lang/crates.io-index') in existing
                  reviewed_feature_edges[('fastrand', '2.5.0')] = {'getrandom 0.4.3'}
              feature_keys = set()
              for key, part in generated_blocks:
                  additions = reviewed_feature_edges.get(key[:2])
                  if additions is not None:
                      feature_keys.add(key)
                      previous = tomllib.loads('[[package]]' + original_by_key[key])['package'][0]
                      expected_package = dict(previous)
                      expected_package['dependencies'] = sorted(set(previous.get('dependencies', [])) | additions)
                      assert tomllib.loads('[[package]]' + part)['package'][0] == expected_package, 'Unreviewed component feature dependency drift: ' + str(key)
              assert {key[:2] for key in feature_keys} == set(reviewed_feature_edges)
              retained = {key: part for key, part in original_blocks if key[2] and key not in feature_keys}
              lock.write_text(header + ''.join('[[package]]' + retained.get(key, part)
                                              for key, part in generated_blocks))
              for command in [
                  ['cargo', 'metadata', '--manifest-path', str(manifest), '--locked', '--format-version', '1'],
              ]:
                  with (output / ('command-' + str(len(commands)) + '.log')).open('wb') as stream:
                      result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT, check=False)
                  commands.append({'argv': command, 'return_code': result.returncode})
                  assert result.returncode == 0, 'Lock command failed; review retained log'
              after = tomllib.loads(lock.read_text())['package']
              derived = {identity(item): item.get('checksum') for item in after}
              crab = [item for item in after if item['name'] == 'crab_nat']
              petgraph = [item for item in after if item['name'] == 'petgraph']
              dns = [item for item in after if item['name'] == 'hickory-server']
              registry = 'registry+https://github.com/rust-lang/crates.io-index'
              reviewed_cookie_packages = {
                  ('cookie', '0.18.2', registry): '1a373e3602691c3cdea496d2f0ee5935151e6168fe87739483c463db1b2f2f87',
                  ('cookie_store', '0.22.1', registry): '15b2c103cf610ec6cae3da84a766285b42fd16aad564758459e6ecf128c75206',
                  ('publicsuffix', '2.3.0', registry): '6f42ea446cab60335f76979ec15e12619a2165b5ae2c12166bef27d283a9fadf',
                  ('psl-types', '2.0.11', registry): '33cb294fe86a74cbcf50d4445b37da762029549ebeea341421c7c70370f86cac',
              }
              packet_key = ('etherparse', '0.21.0', registry)
              reviewed_tun_packages = {
                  ('tun-rs', '2.8.16', registry): '280a6cc03289f9254d9268eadd5712c476dbd7a47ef51aae86e8b9d0b45dcd43',
                  ('nix', '0.31.3', registry): 'cf20d2fde8ff38632c426f1165ed7436270b44f199fc55284c38276f9db47c3d',
                  ('getifaddrs', '0.6.2', registry): 'a542e1b7ac1f3d62c5777d430d66eca9cb59e813c46b86e29fa9ce94ff9a4810',
                  ('libloading', '0.9.0', registry): '754ca22de805bb5744484a5b151a9e1a8e837d5dc232c2d7d8c2e3492edc8b60',
                  ('widestring', '1.2.1', registry): '72069c3113ab32ab29e5584db3c6ec55d416895e60715417b5b883a357c3e471',
                  ('winreg', '0.56.0', registry): '7d6f32a0ff4a9f6f01231eb2059cc85479330739333e0e58cadf03b6af2cca10',
                  ('encoding_rs', '0.8.35', registry): '75030f3c4f45dafd7586dd6780965a8c7e8e285a5ecb86713e63a79c5b2766f3',
                  ('route_manager', '0.2.17', registry): '694798681cd69a10928204225a680ad9416b081d9e9f8718d7a61e2d134da323',
                  ('netlink-packet-core', '0.9.0', registry): '2d6e2daf9a8c2e21302714706860a0e6be02e03d17294ecc66b354ea7d4059dd',
                  ('netlink-packet-route', '0.33.0', registry): '59d48ffc8b73a506e1ff0878528c72668f2bfbc3d875b6be890a96be5d0d5576',
                  ('netlink-sys', '0.9.0', registry): 'c99d38e00b420df49e940fe0826e667c3dad82ac68eb4c2bbf754c1c14a83a10',
                  ('flume', '0.12.0', registry): '5e139bc46ca777eb5efaf62df0ab8cc5fd400866427e56c68b22e414e53bd3be',
                  ('spin', '0.9.9', registry): '3763264f6b73151db08c50ff20d7d8a0b8796e021cdea7ceedad07b80155fa0e',
              }
              reviewed_packet_package = {
                  'name': 'etherparse', 'version': '0.21.0', 'source': registry,
                  'checksum': '17304d06addb3283cdc4bd528e42dd95e73c8ee2d6492ffce415e93660885449',
                  'dependencies': ['arrayvec'],
              }
              # The isolated browser fixture previously did not consume these
              # packages. Permit only the exact, already-reviewed product
              # package, including its dependency edges, never a name alone.
              product_packages = tomllib.loads(pathlib.Path('Cargo.lock').read_text())['package']
              reviewed_product_reuse = {
                  identity(item): item for item in product_packages
                  if item['name'] in {'tokio-stream', 'document-features', 'litrs'} or
                     identity(item) == ('arrayvec', '0.7.8', registry)
              }
              assert any(key[:2] == ('document-features', '0.2.12') and
                         item.get('checksum') == 'd4b8a88685455ed29a21542a33abd9cb6510b6b129abadabdcef0f4c55bc8f61'
                         for key, item in reviewed_product_reuse.items())
              assert any(key[:2] == ('litrs', '1.0.1') and
                         item.get('checksum') == '4744e383959f0db86ede514b809b1c53251889093803c05267acc7d4e7030d70'
                         for key, item in reviewed_product_reuse.items())
              assert reviewed_product_reuse.get(('arrayvec', '0.7.8', registry)) == {
                  'name': 'arrayvec', 'version': '0.7.8', 'source': registry,
                  'checksum': 'd3fb67a6e08acf24fdeccbac2cb6ac4305825bd1f117462e0e6f2f193345ad56',
              }
              changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
              assertions = {
                  'only_selected_lock_changed': set(changed) <= {lock.as_posix()},
                  'all_existing_package_identities_and_checksums_preserved': all(derived.get(key) == checksum and key in derived for key, checksum in existing.items()),
                  'all_unrelated_external_package_edges_preserved': all(
                      tomllib.loads('[[package]]' + part)['package'][0] ==
                      tomllib.loads('[[package]]' + dict(blocks(lock.read_text())[1])[key])['package'][0]
                      for key, part in retained.items()),
                  'only_exact_reviewed_component_feature_edges_added': {key[:2] for key in feature_keys} == set(reviewed_feature_edges),
                  'reviewed_crab_nat_exact_version_and_checksum': len(crab) == 1 and crab[0]['version'] == '0.8.1' and crab[0].get('checksum') == 'b6571f33e3d6520c5b08e54b1202836c6ebe68b950f450951804d037a875c25c',
                  'reviewed_petgraph_exact_version_and_checksum': len(petgraph) == 1 and petgraph[0]['version'] == '0.8.3' and petgraph[0].get('checksum') == '8701b58ea97060d5e5b155d383a69952a60943f0e6dfe30b04c287beb0b27455',
                  'reviewed_authoritative_dns_exact_version': len(dns) == 1 and dns[0]['version'] == '0.26.3' and bool(dns[0].get('checksum')),
                  'locked_metadata_succeeded': all(item['return_code'] == 0 for item in commands),
                  'protected_native_stream_reuses_existing_tokio_identity': any(
                      item['name'] == 'nestlink-platform-security' and 'tokio' in item.get('dependencies', [])
                      for item in after) and any(key[0] == 'tokio' for key in existing),
                  'native_stdio_reuses_locked_tokio_util_identity': any(
                      item['name'] == 'nestlink-platform-security' and 'tokio-util' in item.get('dependencies', [])
                      for item in after) and any(key[:2] == ('tokio-util', '0.7.20') for key in existing),
                  'packet_parser_exact_identity_checksum_and_only_locked_arrayvec_edge':
                      [item for item in after if item['name'] == 'etherparse'] == [reviewed_packet_package],
                  'managed_tun_exact_reviewed_provider_closure': scope != 'product' or all(
                      derived.get(key) == checksum for key, checksum in reviewed_tun_packages.items()),
                  'tun_native_fixture_reuses_exact_locked_packet_parser': scope != 'product' or any(
                      item['name'] == 'nestlink-daemon' and 'etherparse' in item.get('dependencies', [])
                      for item in after),
                  'only_reviewed_cookie_packet_components_or_exact_product_reuse_added': all(
                      identity(item) in existing or not item.get('source')
                      or (identity(item) in reviewed_cookie_packages and
                          item.get('checksum') == reviewed_cookie_packages[identity(item)])
                      or (identity(item) == packet_key and item == reviewed_packet_package)
                      or (identity(item) in reviewed_tun_packages and item.get('checksum') == reviewed_tun_packages[identity(item)])
                      or item == reviewed_product_reuse.get(identity(item)) for item in after),
              }
              assert all(assertions.values()), 'Unreviewed dependency drift or incomplete lock derivation'
          except Exception as error:
              failure = type(error).__name__ + ': ' + str(error)
          finally:
              shutil.copyfile(lock, output / 'Cargo.lock')
              (output / 'derivation.diff').write_bytes(subprocess.check_output(['git', 'diff', '--binary', '--', str(lock)]))
              receipt = {
                  'schema_version': 1, 'purpose': 'reviewed-network-components-lock-derivation-only',
                  'repository': os.environ['GITHUB_REPOSITORY'], 'source_revision': expected,
                  'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'scope': scope, 'manifest_path': manifest.as_posix(),
                  'before_lock_sha256': hashlib.sha256(before_bytes).hexdigest(),
                  'commands': commands, 'assertions': assertions, 'failure': failure,
                  'product_compilation_performed': False, 'quality_or_acceptance_claimed': False,
                  'files': [{'path': item.name, 'bytes': item.stat().st_size,
                             'sha256': hashlib.sha256(item.read_bytes()).hexdigest()}
                            for item in sorted(output.iterdir()) if item.is_file()],
              }
              (output / 'derivation-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          assert failure is None, failure
      - name: Retain original and derived locks for local review without running a toolchain
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-lock-${{ matrix.scope }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-lock-${{ matrix.scope }}/
          if-no-files-found: error
          retention-days: 30
