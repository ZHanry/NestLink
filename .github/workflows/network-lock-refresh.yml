name: Derive reviewed network dependency locks

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact main source containing the reviewed network component manifests
        required: true
        type: string

permissions:
  contents: read

jobs:
  derive-lock:
    strategy:
      fail-fast: false
      matrix:
        scope: [product, browser-native-fixture]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_SOURCE: ${{ inputs.source_revision }}
      LOCK_SCOPE: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
      - name: Resolve only the reviewed manifest additions on GitHub and retain provenance
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, shutil, subprocess, tomllib

          assert os.environ['GITHUB_REPOSITORY'] == 'ZHanry/NestLink'
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          assert os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted'
          expected = os.environ['EXPECTED_SOURCE']
          assert re.fullmatch('[0-9a-f]{40}', expected)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected == os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git', 'status', '--porcelain=v1', '--untracked-files=all']) == b''
          scope = os.environ['LOCK_SCOPE']
          manifest = pathlib.Path({'product': 'Cargo.toml',
                                   'browser-native-fixture': 'scripts/fixtures/browser-native-host/Cargo.toml'}[scope])
          lock = manifest.with_name('Cargo.lock')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / ('network-lock-' + scope)
          output.mkdir()
          traversal = tomllib.loads(pathlib.Path('crates/traversal/Cargo.toml').read_text())
          assert traversal['dependencies']['crab_nat'] == '=0.8.1'
          connectivity = tomllib.loads(pathlib.Path('crates/connectivity/Cargo.toml').read_text())
          assert connectivity['dependencies']['petgraph'] == '=0.8.3'
          assert connectivity['dependencies']['nestlink-identity'] == {'workspace': True}
          sdk = tomllib.loads(pathlib.Path('crates/sdk/Cargo.toml').read_text())
          native = sdk['target']['cfg(not(target_arch = "wasm32"))']['dependencies']
          assert native['hickory-server'] == {'version': '=0.26.3', 'default-features': False}
          assert native['async-trait'] == '=0.1.89'
          assert native['ipnet'] == '=2.12.2'
          before_bytes = lock.read_bytes()
          before = tomllib.loads(before_bytes.decode())['package']
          shutil.copyfile(lock, output / 'before.lock')
          identity = lambda item: (item['name'], item['version'], item.get('source', ''))
          existing = {identity(item): item.get('checksum') for item in before}
          commands, assertions, failure = [], {}, None
          try:
              command = ['cargo', 'update', '--workspace', '--manifest-path', str(manifest)]
              with (output / 'command-0.log').open('wb') as stream:
                  result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT, check=False)
              commands.append({'argv': command, 'return_code': result.returncode})
              assert result.returncode == 0, 'Lock command failed; review retained log'
              shutil.copyfile(lock, output / 'cargo-generated.lock')
              # Cargo can reselect an already-locked compatible windows-sys
              # edge even with --workspace. Preserve existing external blocks.
              # Reviewed feature activation by the pinned graph/DNS components.
              # Keep every preexisting identity, checksum and other edge exact.
              def blocks(raw):
                  parts = raw.split('[[package]]')
                  return parts[0], [(identity(tomllib.loads('[[package]]' + part)['package'][0]), part)
                                    for part in parts[1:]]
              _, original_blocks = blocks(before_bytes.decode())
              header, generated_blocks = blocks(lock.read_text())
              original_by_key = dict(original_blocks)
              reviewed_feature_edges = {
                  ('petgraph', '0.8.3'): {'serde'},
                  ('ipnet', '2.12.2'): {'serde'},
                  ('once_cell', '1.21.4'): {'critical-section', 'portable-atomic'},
                  ('url', '2.5.8'): {'serde_derive'},
              }
              feature_keys = set()
              for key, part in generated_blocks:
                  additions = reviewed_feature_edges.get(key[:2])
                  if additions is not None:
                      feature_keys.add(key)
                      previous = tomllib.loads('[[package]]' + original_by_key[key])['package'][0]
                      expected_package = dict(previous)
                      expected_package['dependencies'] = sorted(set(previous.get('dependencies', [])) | additions)
                      assert tomllib.loads('[[package]]' + part)['package'][0] == expected_package, 'Unreviewed component feature dependency drift: ' + str(key)
              assert {key[:2] for key in feature_keys} == set(reviewed_feature_edges)
              retained = {key: part for key, part in original_blocks if key[2] and key not in feature_keys}
              lock.write_text(header + ''.join('[[package]]' + retained.get(key, part)
                                              for key, part in generated_blocks))
              for command in [
                  ['cargo', 'metadata', '--manifest-path', str(manifest), '--locked', '--format-version', '1'],
              ]:
                  with (output / ('command-' + str(len(commands)) + '.log')).open('wb') as stream:
                      result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT, check=False)
                  commands.append({'argv': command, 'return_code': result.returncode})
                  assert result.returncode == 0, 'Lock command failed; review retained log'
              after = tomllib.loads(lock.read_text())['package']
              derived = {identity(item): item.get('checksum') for item in after}
              crab = [item for item in after if item['name'] == 'crab_nat']
              petgraph = [item for item in after if item['name'] == 'petgraph']
              dns = [item for item in after if item['name'] == 'hickory-server']
              changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
              assertions = {
                  'only_selected_lock_changed': set(changed) <= {lock.as_posix()},
                  'all_existing_package_identities_and_checksums_preserved': all(derived.get(key) == checksum and key in derived for key, checksum in existing.items()),
                  'all_unrelated_external_package_edges_preserved': all(
                      tomllib.loads('[[package]]' + part)['package'][0] ==
                      tomllib.loads('[[package]]' + dict(blocks(lock.read_text())[1])[key])['package'][0]
                      for key, part in retained.items()),
                  'only_exact_reviewed_component_feature_edges_added': {key[:2] for key in feature_keys} == set(reviewed_feature_edges),
                  'reviewed_crab_nat_exact_version_and_checksum': len(crab) == 1 and crab[0]['version'] == '0.8.1' and crab[0].get('checksum') == 'b6571f33e3d6520c5b08e54b1202836c6ebe68b950f450951804d037a875c25c',
                  'reviewed_petgraph_exact_version_and_checksum': len(petgraph) == 1 and petgraph[0]['version'] == '0.8.3' and petgraph[0].get('checksum') == '8701b58ea97060d5e5b155d383a69952a60943f0e6dfe30b04c287beb0b27455',
                  'reviewed_authoritative_dns_exact_version': len(dns) == 1 and dns[0]['version'] == '0.26.3' and bool(dns[0].get('checksum')),
                  'locked_metadata_succeeded': all(item['return_code'] == 0 for item in commands),
              }
              assert all(assertions.values()), 'Unreviewed dependency drift or incomplete lock derivation'
          except Exception as error:
              failure = type(error).__name__ + ': ' + str(error)
          finally:
              shutil.copyfile(lock, output / 'Cargo.lock')
              (output / 'derivation.diff').write_bytes(subprocess.check_output(['git', 'diff', '--binary', '--', str(lock)]))
              receipt = {
                  'schema_version': 1, 'purpose': 'reviewed-network-components-lock-derivation-only',
                  'repository': os.environ['GITHUB_REPOSITORY'], 'source_revision': expected,
                  'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'scope': scope, 'manifest_path': manifest.as_posix(),
                  'before_lock_sha256': hashlib.sha256(before_bytes).hexdigest(),
                  'commands': commands, 'assertions': assertions, 'failure': failure,
                  'product_compilation_performed': False, 'quality_or_acceptance_claimed': False,
                  'files': [{'path': item.name, 'bytes': item.stat().st_size,
                             'sha256': hashlib.sha256(item.read_bytes()).hexdigest()}
                            for item in sorted(output.iterdir()) if item.is_file()],
              }
              (output / 'derivation-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          assert failure is None, failure
      - name: Retain original and derived locks for local review without running a toolchain
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-lock-${{ matrix.scope }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-lock-${{ matrix.scope }}/
          if-no-files-found: error
          retention-days: 30
