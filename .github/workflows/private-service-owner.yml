name: Product space and original private service owner validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-route-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
          components: clippy,rustfmt
      - name: Set original SDK native codec location
        run: echo "NESTLINK_CODEC_PREFIX=$RUNNER_TEMP/nestlink-codecs/x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
      - name: Prepare original hosted SDK native inputs
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build nasm pkg-config dbus libpipewire-0.3-dev pipewire-bin
      - name: Build and verify original locked codecs
        run: |
          python scripts/refactor-native-codecs.py build --target x86_64-unknown-linux-gnu --cache-dir "$RUNNER_TEMP/nestlink-codec-sources" --work-dir "$RUNNER_TEMP/nestlink-codecs"
          python scripts/refactor-native-codecs.py verify --target x86_64-unknown-linux-gnu --prefix "$NESTLINK_CODEC_PREFIX"
      - name: Execute all original private service cases with unchanged deadlines
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-sdk --test private_services -- --show-output --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/private-service-owner-tests.log"
      - name: Execute all delegated space and one-use consent cases
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-app-core --test spaces -- --show-output --test-threads=1 --color never 2>&1 | tee "$RUNNER_TEMP/product-space-owner-tests.log"
      - name: Check original private service targets with strict lint
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --keep-going -p nestlink-sdk -p nestlink-app-core --test private_services --test spaces -- -D warnings 2>&1 | tee "$RUNNER_TEMP/private-service-owner-clippy.log"
      - name: Generate the exact management contract on GitHub
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo run --locked -p xtask -- contract --write 2>&1 | tee "$RUNNER_TEMP/product-owner-openapi.log"
          cp protocol-spec/openapi.json "$RUNNER_TEMP/product-owner-openapi.json"
      - name: Bind retained original logs to source and execution
        if: always()
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          assert os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted'
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert revision == os.environ['GITHUB_SHA']
          files = [root / name for name in ('private-service-owner-tests.log', 'product-space-owner-tests.log', 'private-service-owner-clippy.log', 'product-owner-openapi.log', 'product-owner-openapi.json')]
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert set(changed) <= {'protocol-spec/openapi.json'}, changed
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')[:-1]
          receipt = {
              'source_revision': revision,
              'dependency_lock_sha256': hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest(),
              'workflow': os.environ['GITHUB_WORKFLOW_REF'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'runner_environment': os.environ['RUNNER_ENVIRONMENT'], 'runner_os': os.environ['RUNNER_OS'],
              'scope': 'Original private_services and all product spaces cases; dedicated external-role ignores remain independent. OpenAPI is generated by cargo run --locked -p xtask -- contract --write. Receipt alone makes no pass claim.',
              'source_file_sha256': {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in tracked if name != 'protocol-spec/openapi.json'},
              'files': [{'path': path.name, 'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()} for path in files if path.is_file()],
          }
          (root / 'private-service-owner-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
      - name: Preserve original failures and exact-source logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: private-service-owner-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/private-service-owner-tests.log
            ${{ runner.temp }}/product-space-owner-tests.log
            ${{ runner.temp }}/private-service-owner-clippy.log
            ${{ runner.temp }}/product-owner-openapi.log
            ${{ runner.temp }}/product-owner-openapi.json
            ${{ runner.temp }}/private-service-owner-receipt.json
          if-no-files-found: error
          retention-days: 30
