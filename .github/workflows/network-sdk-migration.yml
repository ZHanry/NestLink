name: Production SDK relay DROP migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-sdk-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  automatic-sdk-relay-drop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
      - name: Set the existing SDK native codec location
        shell: bash
        run: echo "NESTLINK_CODEC_PREFIX=${{ runner.temp }}/nestlink-codecs/x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
      - name: Prepare the existing SDK native build inputs
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build nasm pkg-config dbus libpipewire-0.3-dev pipewire-bin
      - name: Build and verify the locked existing native codecs on GitHub
        run: |
          python scripts/refactor-native-codecs.py build --target x86_64-unknown-linux-gnu --cache-dir "${{ runner.temp }}/nestlink-codec-sources" --work-dir "${{ runner.temp }}/nestlink-codecs"
          python scripts/refactor-native-codecs.py verify --target x86_64-unknown-linux-gnu --prefix "${{ env.NESTLINK_CODEC_PREFIX }}"
      - name: Exercise twenty fresh original authorities through actual relay DROP and automatic SDK polling
        run: python -B scripts/network-rewrite-sdk-migration.py --output "${{ runner.temp }}/network-sdk-migration-evidence"
      - name: Strict lint for the production SDK and original relay cases
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/network-sdk-migration-evidence"
          cargo clippy --locked -p nestlink-sdk --test network_relay -- -D warnings 2>&1 | tee "$RUNNER_TEMP/network-sdk-migration-evidence/strict-clippy.log"
      - name: Retain exact source, nft counters, original inner binding, approved files and physical receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: network-sdk-migration-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/network-sdk-migration-evidence/
          if-no-files-found: error
          retention-days: 30
