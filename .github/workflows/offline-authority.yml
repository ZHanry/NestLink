name: Independent finite offline authority

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
          components: clippy
      - name: Compile and execute the exact complete-bundle authority cases
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'offline-authority'
          output.mkdir()
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['GITHUB_SHA']
          assert os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted'
          command = ['cargo', 'test', '--locked', '-p', 'nestlink-identity', '--lib', '--no-run', '--message-format=json']
          with (output / 'build.jsonl').open('w') as stream, (output / 'build.log').open('w') as errors:
              built = subprocess.run(command, stdout=stream, stderr=errors, check=False)
          receipt = {
              'source_revision': source, 'workflow': os.environ['GITHUB_WORKFLOW_REF'],
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'runner_environment': os.environ['RUNNER_ENVIRONMENT'], 'runner_os': os.environ['RUNNER_OS'],
              'scope': 'L1 protocol/identity/finite-owner primitives only; no production API, durable quota, carrier or target acceptance',
              'cargo_lock_sha256': hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest(),
              'build_command': command, 'build_exit_code': built.returncode, 'passed': False,
          }
          if built.returncode == 0:
              executables = [json.loads(line)['executable'] for line in (output / 'build.jsonl').read_text().splitlines()
                             if json.loads(line).get('reason') == 'compiler-artifact'
                             and json.loads(line).get('executable')]
              assert len(executables) == 1, executables
              executable = pathlib.Path(executables[0])
              inventory = subprocess.check_output([str(executable), 'offline::', '--list'], text=True)
              (output / 'inventory.log').write_text(inventory)
              names = [line.removesuffix(': test') for line in inventory.splitlines() if line.endswith(': test')]
              assert len(names) == 7 and len(set(names)) == 7, names
              execution = [str(executable), 'offline::', '--nocapture', '--test-threads=1', '--color', 'never']
              with (output / 'tests.log').open('w') as stream:
                  tested = subprocess.run(execution, stdout=stream, stderr=subprocess.STDOUT, timeout=60, check=False)
              log = (output / 'tests.log').read_text()
              receipt.update(executable_sha256=hashlib.sha256(executable.read_bytes()).hexdigest(),
                             tests=names, execution_command=execution, test_exit_code=tested.returncode,
                             passed=tested.returncode == 0 and '7 passed; 0 failed; 0 ignored' in log)
          receipt['files'] = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(output.iterdir())}
          (output / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          assert receipt['passed'], 'Retained diagnostics; no authority qualification from this attempt'
      - name: Exercise original remote signed meter and retained Session
        run: |
          python3 -B scripts/network-rewrite-offline-management.py --suite remote-identity --output "$RUNNER_TEMP/offline-authority/remote-identity"
          python3 -B scripts/network-rewrite-offline-management.py --suite remote-session --output "$RUNNER_TEMP/offline-authority/remote-session"
      - name: Lint independent authority without suppressing warnings
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked -p nestlink-protocol -p nestlink-identity -p nestlink-session --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/offline-authority/clippy.log"
      - name: Preserve same-source primitive evidence and exact failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: offline-authority-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-authority/
          if-no-files-found: error
          retention-days: 30

  durable-private-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
          components: clippy
      - name: Compile and execute original-ledger SQLite offline cases
        run: python3 -B scripts/network-rewrite-offline-management.py --suite storage --output "$RUNNER_TEMP/offline-storage"
      - name: Verify historical migrations and existing shared service budgets
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nestlink-storage --lib --tests --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/offline-storage/storage-regression.log"
      - name: Strict storage and identity lint
        if: ${{ !cancelled() }}
        run: python3 -B scripts/network-rewrite-offline-management.py --suite remote-storage --output "$RUNNER_TEMP/offline-storage/remote-budget"
      - name: Strict original storage and identity lint
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked -p nestlink-storage -p nestlink-identity -p nestlink-protocol --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/offline-storage/clippy.log"
      - name: Preserve durable offline diagnostics and exact receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: offline-management-storage-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-storage/
          if-no-files-found: error
          retention-days: 30

  actual-http-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
          components: clippy
      - name: Configure original native SDK codec paths
        run: echo "NESTLINK_CODEC_PREFIX=$RUNNER_TEMP/nestlink-codecs/x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
      - name: Install hosted native SDK build tooling
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build nasm pkg-config libpipewire-0.3-dev
      - name: Build and verify original native SDK inputs on GitHub
        run: |
          python3 scripts/refactor-native-codecs.py build --target x86_64-unknown-linux-gnu --cache-dir "$RUNNER_TEMP/nestlink-codec-sources" --work-dir "$RUNNER_TEMP/nestlink-codecs"
          python3 scripts/refactor-native-codecs.py verify --target x86_64-unknown-linux-gnu --prefix "$NESTLINK_CODEC_PREFIX"
      - name: Compile and exercise actual HTTP SDK approval and one-use activation
        run: python3 -B scripts/network-rewrite-offline-management.py --suite sdk --output "$RUNNER_TEMP/offline-sdk"
      - name: Strict production server and SDK lint
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/offline-sdk"
          set -o pipefail
          cargo clippy --locked -p nestlink-server -p nestlink-sdk -p nestlink-transport-quic -p nestlink-remote -p nestlink-session --lib -- -D warnings 2>&1 | tee "$RUNNER_TEMP/offline-sdk/clippy.log"
      - name: Exercise original remote HTTP signed budget and real QUIC business
        if: ${{ !cancelled() }}
        run: python3 -B scripts/network-rewrite-offline-management.py --suite remote-sdk --output "$RUNNER_TEMP/offline-sdk/remote-budget"
      - name: Compile and lint original daemon resident offline entry
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/offline-sdk"
          set -o pipefail
          cargo clippy --locked -p nestlink-daemon --bin nestlink-daemon -- -D warnings 2>&1 | tee "$RUNNER_TEMP/offline-sdk/daemon-clippy.log"
      - name: Exercise resident original authority on local logout identity change and maintenance
        if: ${{ !cancelled() }}
        run: python3 -B scripts/network-rewrite-offline-management.py --suite daemon --output "$RUNNER_TEMP/offline-sdk/resident-guard"
      - name: Preserve actual HTTP SDK diagnostics and exact receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: offline-management-sdk-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/offline-sdk/
          if-no-files-found: error
          retention-days: 30
