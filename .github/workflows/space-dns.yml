name: Owned system split DNS

on:
  push:
    branches: [main]
    paths:
      - "Cargo.*"
      - "apps/daemon/**"
      - "crates/**"
      - "scripts/network-rewrite-system-dns.py"
      - ".github/workflows/space-dns.yml"
  pull_request:
    paths:
      - "Cargo.*"
      - "apps/daemon/**"
      - "crates/**"
      - "scripts/network-rewrite-system-dns.py"
      - ".github/workflows/space-dns.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-dns-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system-dns:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.96.0"
          components: clippy
      - name: Set the existing native codec location
        shell: bash
        run: echo "NESTLINK_CODEC_PREFIX=${{ runner.temp }}/nestlink-codecs/${{ matrix.target }}" >> "$GITHUB_ENV"
      - name: Prepare existing Linux inputs and the actual resolved service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm pkg-config dbus libpipewire-0.3-dev pipewire-bin iproute2 systemd-resolved
          sudo systemctl start systemd-resolved
          systemctl is-active systemd-resolved
          cat /etc/resolv.conf
          resolvectl status
      - name: Prepare existing Windows codec tools
        if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MSYS
          install: make perl diffutils gawk sed grep coreutils nasm
          cache: false
      - name: Build the locked existing native codecs on Linux
        if: runner.os == 'Linux'
        run: python3 scripts/refactor-native-codecs.py build --target ${{ matrix.target }} --cache-dir "${{ runner.temp }}/nestlink-codec-sources" --work-dir "${{ runner.temp }}/nestlink-codecs"
      - name: Build the locked existing native codecs on Windows
        if: runner.os == 'Windows'
        run: python scripts/refactor-native-codecs.py build --target ${{ matrix.target }} --cache-dir "${{ runner.temp }}/nestlink-codec-sources" --work-dir "${{ runner.temp }}/nestlink-codecs" --msys-bin "${{ steps.msys.outputs.msys2-location }}/usr/bin" --nasm "${{ steps.msys.outputs.msys2-location }}/usr/bin/nasm.exe"
      - run: python scripts/refactor-native-codecs.py verify --target ${{ matrix.target }} --prefix "${{ env.NESTLINK_CODEC_PREFIX }}"
      - name: Allow the ordinary Windows token to read and execute test inputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dnsTestSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $dnsTestTemp = Join-Path $env:RUNNER_TEMP 'nestlink-dns-normal-user-temp'
          New-Item -ItemType Directory -Path $dnsTestTemp -Force | Out-Null
          $dnsInputs = @(
            @{ Path = $env:GITHUB_WORKSPACE; Access = 'M' },
            @{ Path = $env:NESTLINK_CODEC_PREFIX; Access = 'RX' },
            @{ Path = $dnsTestTemp; Access = 'M' }
          )
          foreach ($dnsInput in $dnsInputs) {
            & icacls $dnsInput.Path /grant "*${dnsTestSid}:(OI)(CI)$($dnsInput.Access)" /T /Q
            if ($LASTEXITCODE -ne 0) { throw 'Could not prepare ordinary DNS test inputs' }
          }
          "TEMP=$dnsTestTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$dnsTestTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise ordinary daemon ownership and real elevated OS resolver recovery
        run: python -B scripts/network-rewrite-system-dns.py --output "${{ runner.temp }}/system-dns-evidence"
      - name: Lint all daemon targets independently of the OS test result
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p nestlink-daemon --all-targets -- -D warnings
      - name: Check managed TUN plan ownership and bounded file reads on Linux
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: cargo test --locked -p nestlink-daemon --bin nestlink-daemon network_tun_system:: -- --show-output --test-threads=1 --color never
      - name: Exercise ordinary UID TUN whole packets and original helper crash recovery
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          assert os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted' and os.geteuid() != 0
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tun-native-evidence'
          output.mkdir()
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['GITHUB_SHA']
          build = ['cargo', 'test', '--locked', '-p', 'nestlink-daemon', '--bin', 'nestlink-daemon', '--no-run', '--message-format=json-render-diagnostics']
          result = subprocess.run(build, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          (output / 'build.jsonl').write_bytes(result.stdout)
          (output / 'build.log').write_bytes(result.stderr)
          receipt = {'source_revision': source, 'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'runner_environment': os.environ['RUNNER_ENVIRONMENT'],
              'ordinary_uid': os.geteuid(), 'build_command': build, 'build_return_code': result.returncode,
              'cargo_lock_sha256': hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest(),
              'scope': 'Kernel TUN mechanism only; production login/online authorization and two-device acceptance remain separate',
              'passed': False}
          if result.returncode == 0:
              artifacts = [item['executable'] for line in result.stdout.decode().splitlines()
                  if (item := json.loads(line)).get('reason') == 'compiler-artifact'
                  and item.get('target', {}).get('name') == 'nestlink-daemon' and item.get('executable')]
              assert len(artifacts) == 1, artifacts
              executable = pathlib.Path(artifacts[0])
              receipt['executable_sha256'] = hashlib.sha256(executable.read_bytes()).hexdigest()
              case = 'network_tun_system::native_tests::ordinary_uid_root_helper_whole_packets_normal_close_and_crash_recovery'
              command = [str(executable), '--exact', case, '--ignored', '--nocapture', '--test-threads=1']
              environment = dict(os.environ, NESTLINK_TUN_NATIVE_LAB='1')
              with (output / 'execution.log').open('wb') as log:
                  code = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, env=environment).returncode
              receipt.update(execution_command=command, execution_return_code=code, passed=code == 0)
          (output / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          assert receipt['passed'], 'Real TUN mechanism failed; retained logs and receipt are authoritative'
      - name: Retain TUN build and actual kernel execution provenance
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tun-native-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tun-native-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Retain source, executable digest, every command result and OS diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: system-dns-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/system-dns-evidence/
          if-no-files-found: error
          retention-days: 30
