name: Original offline native resident focused validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resident:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify original ordinary Windows test token
        if: runner.os == 'Windows'
        run: python scripts/refactor-windows-normal-user.py python scripts/refactor-windows-normal-user.py --check
      - name: Set original pinned native codec location
        shell: pwsh
        env:
          NESTLINK_TARGET: ${{ matrix.target }}
        run: |
          $codecRoot = Join-Path $env:RUNNER_TEMP "nestlink-codecs/$env:NESTLINK_TARGET"
          "NESTLINK_CODEC_PREFIX=$codecRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install original Linux build and platform fixture inputs
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build nasm pkg-config dbus libpipewire-0.3-dev pipewire-bin xvfb x11-xserver-utils gnome-keyring libsecret-tools libpam-systemd
      - if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MSYS
          install: make perl diffutils gawk sed grep coreutils nasm
          cache: false
      - name: Build original pinned native codecs on Linux
        if: runner.os == 'Linux'
        run: python3 scripts/refactor-native-codecs.py build --target ${{ matrix.target }} --cache-dir "${{ runner.temp }}/nestlink-codec-sources" --work-dir "${{ runner.temp }}/nestlink-codecs"
      - name: Build original pinned native codecs on Windows
        if: runner.os == 'Windows'
        run: python scripts/refactor-native-codecs.py build --target ${{ matrix.target }} --cache-dir "${{ runner.temp }}/nestlink-codec-sources" --work-dir "${{ runner.temp }}/nestlink-codecs" --msys-bin "${{ steps.msys.outputs.msys2-location }}/usr/bin" --nasm "${{ steps.msys.outputs.msys2-location }}/usr/bin/nasm.exe"
      - name: Verify original pinned native codec installation
        run: python scripts/refactor-native-codecs.py verify --target ${{ matrix.target }} --prefix "${{ env.NESTLINK_CODEC_PREFIX }}"
      - name: Allow the original ordinary Windows token to use CI inputs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testUserSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $testTemp = Join-Path $env:RUNNER_TEMP 'nestlink-normal-user-temp'
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          $testInputs = @(
            @{ Path = (Join-Path $env:USERPROFILE '.rustup'); Access = 'RX' },
            @{ Path = (Join-Path $env:USERPROFILE '.cargo'); Access = 'M' },
            @{ Path = $env:GITHUB_WORKSPACE; Access = 'M' },
            @{ Path = $env:NESTLINK_CODEC_PREFIX; Access = 'RX' },
            @{ Path = $testTemp; Access = 'M' }
          )
          foreach ($testInput in $testInputs) {
            & icacls $testInput.Path /grant "*${testUserSid}:(OI)(CI)$($testInput.Access)" /T /Q
            if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the original CI input permissions' }
          }
          "TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Freeze original public-PKI HTTPS fixture tool and license
        if: ${{ !cancelled() }}
        run: python scripts/refactor-offline-resident-https.py
      - name: Compile lint and execute all original offline native resident cases
        if: ${{ !cancelled() }}
        run: python -B scripts/refactor-offline-resident-check.py
      - name: Preserve focused exact-source successes and original failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-offline-resident-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nestlink-offline-resident-focused/
            ${{ runner.temp }}/nestlink-native-offline-https-tool.json
            ${{ runner.temp }}/nestlink-native-offline-https-license.txt
            ${{ env.NESTLINK_CODEC_PREFIX }}/nestlink-codecs.json
          if-no-files-found: error
          retention-days: 30
