// A separate development variant: no fixed Release keystore or production
// signing assertion. preReleaseBuild and the formal producer remain unchanged.
gradle.beforeProject { candidateProject ->
    def externalBuild = System.getenv("NESTLINK_CANDIDATE_ANDROID_BUILD")
    if (externalBuild == null || externalBuild.trim().isEmpty()) {
        throw new GradleException("Set an external NESTLINK_CANDIDATE_ANDROID_BUILD directory")
    }
    candidateProject.layout.buildDirectory.set(new File(externalBuild, candidateProject.name))
    candidateProject.plugins.withId("com.android.application") {
        def android = candidateProject.extensions.getByName("android")
        android.buildTypes.getByName("debug").applicationIdSuffix = ".candidate"
        android.buildTypes.getByName("debug").versionNameSuffix = ""
    }
}
