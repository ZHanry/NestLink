[package]
name = "nestlink-privileged"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nestlink-identity.workspace = true
nestlink-protocol.workspace = true
nestlink-remote.workspace = true
nestlink-platform-input.workspace = true
nestlink-platform-session.workspace = true
nestlink-platform-security.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
rand_core.workspace = true
base64.workspace = true
sha2.workspace = true
clap.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_System_Rpc", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Registry", "Win32_System_StationsAndDesktops", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[dev-dependencies]
prost.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
