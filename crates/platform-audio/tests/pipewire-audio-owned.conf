# First-party private software graph. No ALSA, microphone or desktop access.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    support.dbus = false
    mem.warn-mlock = false
    default.clock.rate = 48000
    default.clock.quantum = 960
    default.clock.min-quantum = 960
    default.clock.max-quantum = 960
}
context.spa-libs = {
    support.* = support/libspa-support
    audio.convert.* = audioconvert/libspa-audioconvert
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-access args = { access.force = unrestricted } }
]
context.objects = [
    { factory = spa-node-factory args = {
        factory.name = support.node.driver node.name = nestlink-audio-driver node.group = pipewire.dummy priority.driver = 20000
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink node.name = nestlink-selected-sink media.class = Audio/Sink
        audio.position = [ FL FR ]
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink node.name = nestlink-other-sink media.class = Audio/Sink
        audio.position = [ FL FR ]
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink node.name = nestlink-synthetic-mic media.class = Audio/Source/Virtual
        audio.position = [ FL FR ]
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
    } }
]
