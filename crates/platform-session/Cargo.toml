[package]
name = "nestlink-platform-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Graphics_Gdi", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.190"
tokio.workspace = true
futures-util.workspace = true
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
x11rb-protocol = "0.13.2"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
