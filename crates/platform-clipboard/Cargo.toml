[package]
name = "nestlink-platform-clipboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nestlink-protocol.workspace = true
nestlink-platform-session.workspace = true
zeroize = "=1.9.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "=0.13.2", default-features = false, features = ["xfixes"] }
x11rb-protocol = "=0.13.2"
libc = "=0.2.190"
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
tokio.workspace = true
futures-util.workspace = true

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
